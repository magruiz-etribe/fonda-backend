    description_es: >
      Puré de frijoles con chorizo y queso.
    description_en: >
      Puré de frijoles con chorizo y queso.
  de_la_olla:
    name_es: Frijoles de la olla
    name_en: Pot Beans
    extra_ingredients:
      - frijol
      - agua
