category: antojito
base_ingredients:
  - masa_de_maiz
  - manteca
  - hoja_de_maiz_o_platano
  - sal
variants:
  verde:
    name_es: Tamal verde
    name_en: Green Tamale
    extra_ingredients:
      - pollo
      - tomatillo
      - chile_serrano
    technique: masa rellena de pollo en salsa verde, cocida al vapor en hoja de maíz
    description_es: >
      Tamal relleno de pollo en salsa verde de tomatillo.
    description_en: >
      Steamed corn masa tamale filled with chicken in green tomatillo sauce.
  rojo:
    name_es: Tamal rojo
    name_en: Red Tamale
    extra_ingredients:
      - carne_de_cerdo
      - chile_guajillo
      - jitomate
    technique: masa rellena de cerdo en salsa roja, cocida al vapor
    description_es: >
      Tamal relleno de cerdo en salsa roja de chile guajillo.
    description_en: >
      Steamed tamale filled with pork in red guajillo chile sauce.
  de_pollo_en_salsa_verde:
    name_es: Tamal de pollo en salsa verde
    name_en: Chicken Tamale in Green Sauce
    extra_ingredients:
      - pollo
      - tomatillo
      - chile_serrano
    technique: relleno de pollo deshebrado en salsa verde
    description_es: >
      Tamal de pollo deshebrado en salsa verde.
    description_en: >
      Corn tamale filled with shredded chicken in tangy green sauce.
  de_pollo_en_salsa_roja:
    name_es: Tamal de pollo en salsa roja
    name_en: Chicken Tamale in Red Sauce
    extra_ingredients:
      - pollo
      - chile_guajillo
      - jitomate
    technique: relleno de pollo en salsa roja de chile seco
    description_es: >
      Tamal de pollo en salsa roja de chile guajillo.
    description_en: >
      Corn tamale filled with chicken in red dried-chile sauce.
  de_pollo_en_adobo:
    name_es: Tamal de pollo en adobo
    name_en: Chicken Tamale in Adobo
    extra_ingredients:
      - pollo
      - chile_ancho
      - vinagre
      - especias
    technique: relleno de pollo marinado en adobo de chile ancho
    description_es: >
      Tamal de pollo en adobo de chile ancho.
    description_en: >
      Tamale filled with chicken marinated in ancho chile adobo.
  de_cerdo_en_salsa_verde:
    name_es: Tamal de cerdo en salsa verde
    name_en: Pork Tamale in Green Sauce
    extra_ingredients:
      - cerdo
      - tomatillo
    technique: relleno de cerdo en salsa verde
    description_es: >
      Tamal de cerdo en salsa verde de tomatillo.
    description_en: >
      Tamale filled with pork in green tomatillo sauce.
  de_cerdo_en_salsa_roja:
    name_es: Tamal de cerdo en salsa roja
    name_en: Pork Tamale in Red Sauce
    extra_ingredients:
      - cerdo
      - chile_guajillo
    technique: relleno de cerdo en salsa roja
    description_es: >
      Tamal de cerdo en salsa roja de chile.
    description_en: >
      Tamale filled with pork in red chile sauce.
  de_cerdo_en_adobo:
    name_es: Tamal de cerdo en adobo
    name_en: Pork Tamale in Adobo
    extra_ingredients:
      - cerdo
      - chile_ancho
      - vinagre
    technique: relleno de cerdo en adobo
    description_es: >
      Tamal de cerdo en adobo de chile ancho.
    description_en: >
      Tamale filled with pork in ancho chile adobo.
  de_res_en_salsa_roja:
    name_es: Tamal de res en salsa roja
    name_en: Beef Tamale in Red Sauce
    extra_ingredients:
      - res
      - chile_colorado
    technique: relleno de res deshebrada en salsa roja
    description_es: >
      Tamal de res deshebrada en salsa roja.
    description_en: >
      Tamale filled with shredded beef in red chile sauce.
  de_frijol:
    name_es: Tamal de frijol
    name_en: Bean Tamale
    extra_ingredients:
      - frijoles
    technique: relleno de frijoles sazonados
    description_es: >
      Tamal relleno de frijoles sazonados.
    description_en: >
      Steamed tamale filled with seasoned beans.
  de_frijol_negro:
    name_es: Tamal de frijol negro
    name_en: Black Bean Tamale
    extra_ingredients:
      - frijol_negro
    technique: relleno de frijol negro cocido con especias
    description_es: >
      Tamal relleno de frijol negro.
    description_en: >
      Tamale filled with seasoned black beans.
  de_camaron:
    name_es: Tamal de camarón
    name_en: Shrimp Tamale
    extra_ingredients:
      - camaron
      - chile_guajillo
    technique: relleno de camarón en salsa de chile
    description_es: >
      Tamal relleno de camarón en salsa regional.
    description_en: >
      Tamale filled with shrimp in regional chile sauce.
  de_atun:
    name_es: Tamal de atún
    name_en: Tuna Tamale
    extra_ingredients:
      - atun
      - jitomate
      - chile
    technique: relleno de atún en salsa de jitomate
    description_es: >
      Tamal relleno de atún en salsa de jitomate.
    description_en: >
      Tamale filled with tuna in tomato-chile sauce.
  de_huitlacoche:
    name_es: Tamal de huitlacoche
    name_en: Huitlacoche Tamale
    extra_ingredients:
      - huitlacoche
      - epazote
    technique: relleno de huitlacoche guisado con epazote
    description_es: >
      Tamal relleno de huitlacoche guisado.
    description_en: >
      Tamale filled with sautéed corn fungus (huitlacoche).
  de_flor_de_calabaza:
    name_es: Tamal de flor de calabaza
    name_en: Squash Blossom Tamale
    extra_ingredients:
      - flor_de_calabaza
      - queso
    technique: relleno de flor de calabaza con queso
    description_es: >
      Tamal relleno de flor de calabaza y queso.
    description_en: >
      Tamale filled with squash blossoms and cheese.
  de_rajas_con_queso:
    name_es: Tamal de rajas con queso
    name_en: Poblano Pepper and Cheese Tamale
    extra_ingredients:
      - rajas_de_chile_poblano
      - queso
    technique: relleno de rajas de chile poblano con queso
    description_es: >
      Tamal relleno de rajas de chile poblano con queso.
    description_en: >
      Tamale filled with roasted poblano strips and cheese.
  de_papa_con_chorizo:
    name_es: Tamal de papa con chorizo
    name_en: Potato and Chorizo Tamale
    extra_ingredients:
      - papa
      - chorizo
    technique: relleno de papa con chorizo
    description_es: >
      Tamal relleno de papa con chorizo.
    description_en: >
      Tamale filled with potato and Mexican chorizo.
  de_hoja_santa:
    name_es: Tamal de hoja santa
    name_en: Hoja Santa Tamale
    extra_ingredients:
      - hoja_santa
      - queso
    technique: masa aromatizada o envuelta con hoja santa
    description_es: >
      Tamal con aroma de hoja santa, relleno de queso u otro guiso.
    description_en: >
      Tamale scented with hoja santa leaves, typically filled with cheese.
  de_mole:
    name_es: Tamal de mole
    name_en: Mole Tamale
    extra_ingredients:
      - mole
      - pollo
    technique: relleno de pollo en mole, envuelto en hoja de plátano u hoja de maíz
    description_es: >
      Tamal relleno de pollo en mole.
    description_en: >
      Tamale filled with chicken in mole sauce.
  oaxaqueno:
    name_es: Tamal oaxaqueño
    name_en: Oaxacan Tamale
    extra_ingredients:
      - hoja_de_platano
      - mole
      - pollo
    technique: envuelto en hoja de plátano con relleno de mole y pollo
    description_es: >
      Tamal envuelto en hoja de plátano con mole y pollo.
    description_en: >
      Banana-leaf tamale with mole and chicken filling.
  de_chepil:
    name_es: Tamal de chepil
    name_en: Chepil Herb Tamale
    extra_ingredients:
      - chepil
    technique: hierba chepil mezclada en la masa
    description_es: >
      Tamal con hierba chepil en la masa.
    description_en: >
      Tamale with chepil herb mixed into the corn masa.
  de_chipilin:
    name_es: Tamal de chipilín
    name_en: Chipilín Tamale
    extra_ingredients:
      - chipilin
    technique: hojas de chipilín mezcladas en la masa
    description_es: >
      Tamal con hojas de chipilín en la masa.
    description_en: >
      Tamale with chipilín leaves mixed into the masa.
  colado:
    name_es: Tamal colado
    name_en: Strained Masa Tamale
    extra_ingredients:
      - masa_colada
      - manteca
    technique: masa colada y tamizada, cocida al vapor
    description_es: >
      Tamal de masa colada fina con manteca.
    description_en: >
      Smooth strained corn masa tamale steamed until tender.
  de_elote:
    name_es: Tamal de elote
    name_en: Fresh Corn Tamale
    extra_ingredients:
      - elote
      - mantequilla
    technique: masa de granos de elote fresco molidos
    description_es: >
      Tamal elaborado con granos de elote fresco molidos.
    description_en: >
      Tamale made from fresh ground corn kernels.
  de_elote_dulce:
    name_es: Tamal de elote dulce
    name_en: Sweet Corn Tamale
    extra_ingredients:
      - elote
      - azucar
      - canela
    technique: masa de elote endulzada con azúcar o piloncillo
    description_es: >
      Tamal dulce de elote con azúcar y canela.
    description_en: >
      Sweet fresh-corn tamale with sugar and cinnamon.
  de_elote_salado:
    name_es: Tamal de elote salado
    name_en: Savory Corn Tamale
    extra_ingredients:
      - elote
      - chile
      - queso
    technique: masa de elote con chile y queso
    description_es: >
      Tamal salado de elote con chile y queso.
    description_en: >
      Savory fresh-corn tamale with chile and cheese.
  de_dulce:
    name_es: Tamal de dulce
    name_en: Sweet Tamale
    extra_ingredients:
      - azucar
      - pasas
      - canela
    technique: masa endulzada con pasas y canela
    description_es: >
      Tamal dulce de masa con pasas, azúcar y canela.
    description_en: >
      Sweet corn tamale with raisins, sugar, and cinnamon.
  de_chocolate:
    name_es: Tamal de chocolate
    name_en: Chocolate Tamale
    extra_ingredients:
      - cacao
      - azucar
      - canela
    technique: masa endulzada con cacao y canela
    description_es: >
      Tamal dulce con cacao y canela en la masa.
    description_en: >
      Sweet tamale with cocoa and cinnamon in the masa.
  de_coco:
    name_es: Tamal de coco
    name_en: Coconut Tamale
    extra_ingredients:
      - coco
      - azucar
    technique: masa endulzada con coco rallado
    description_es: >
      Tamal dulce con coco rallado.
    description_en: >
      Sweet tamale with shredded coconut.
  de_pina:
    name_es: Tamal de piña
    name_en: Pineapple Tamale
    extra_ingredients:
      - pina
      - azucar
    technique: masa endulzada con trozos de piña
    description_es: >
      Tamal dulce con trozos de piña.
    description_en: >
      Sweet tamale with pineapple pieces.
