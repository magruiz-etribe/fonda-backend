canonical_name: pipian
common_names:
  - mole de pepita
category: guisado
base_ingredients:
  - pepitas_de_calabaza
  - chile_verde_o_chile_seco
  - jitomate_o_tomate_verde
  - ajo
  - cebolla
  - ajonjol
  - cilantro_o_epazote
  - caldo_de_pollo
  - sal
variants:
  pipian:
    name_es: Pipian
    name_en: Pumpkin Seed Mole
    extra_ingredients:
      - cacahuate
      - almendra
      - canela
      - clavo
    technique: 
    description_es: >
      Salsa espesa hecha con semillas y chiles, servida con pollo o carne.
    description_en: >
      Thick sauce made with ground seeds and chiles, served with chicken or meat.
  chilacayote:
    name_es: Pipian En Chilacayote
    name_en: Pipián with Squash
    extra_ingredients:
      - cacahuate
      - almendra
      - canela
      - clavo
    technique: 
    description_es: >
      Elaborada con semillas molidas, chiles y especias, puede prepararse con carne o en versión vegetariana y suele acompañarse con arroz, frijoles y tortillas..
    description_en: >
      Ground seed sauce with chiles and spices; served with meat or as a vegetarian version with rice, beans, and tortillas.
  verde:
    name_es: Pipián verde
    name_en: Green Pumpkin Seed Mole
    extra_ingredients:
      - pepita_de_calabaza
      - tomate_verde
      - cilantro
      - chile_serrano
    technique: 
    description_es: >
      Salsa espesa preparada con semillas de calabaza y hierbas verdes.
    description_en: >
      Thick sauce made with pumpkin seeds and green herbs.
  rojo:
    name_es: Pipián rojo
    name_en: Red Pumpkin Seed Mole
    extra_ingredients:
      - pepita_de_calabaza
      - chile_ancho
      - chile_guajillo
    technique: 
    description_es: >
      Mole elaborado con pepitas molidas y chiles secos.
    description_en: >
      Mole-style sauce made with ground pumpkin seeds and dried chiles.
