canonical_name: albondigas
common_names:
  - albóndigas
  - abóndigas
  - sopa de albóndigas
  - albóndigas en chipotle
  - albóndigas en salsa roja
  - albóndigas en salsa verde
  - albóndigas a la jardinera
  - albóndigas en caldo
  - albóndigas en caldillo
  - albóndigas rellenas de huevo
  - albóndigas en mole
  - albóndigas de res
  - albóndigas mixtas
  - albóndigas de pollo
  - albóndigas de pescado
  - albóndigas vegetarianas
  - albóndigas en salsa de cerveza
category: guisado
base_ingredients:
  - carne_molida
  - huevo
  - pan_molido
  - ajo
  - cebolla
  - sal
  - pimienta
  - cilantro
variants:
  en_chipotle:
    name_es: Albóndigas en chipotle
    name_en: Meatballs in Chipotle Sauce
    extra_ingredients:
      - chipotle
      - jitomate
    technique: albóndigas cocidas en salsa de chipotle adobado con jitomate
    description_es: >
      Albóndigas de carne en salsa de chipotle con jitomate.
    description_en: >
      Ground meat meatballs simmered in a creamy chipotle-tomato sauce.
  sopa:
    name_es: Sopa de albóndigas
    name_en: Mexican Meatball Soup
    extra_ingredients:
      - arroz
      - zanahoria
      - calabaza
      - jitomate
      - menta
    technique: albóndigas cocidas directamente en caldo de verduras o jitomate
    description_es: >
      Caldo con albóndigas de carne, arroz, zanahoria, calabaza y jitomate.
    description_en: >
      Tomato broth with small ground meat and rice meatballs, carrot, zucchini, and fresh mint.
  con_arroz:
    name_es: Albóndigas al chipotle con arroz
    name_en: Chipotle Meatballs with Red Rice
    extra_ingredients:
      - chile_chipotle
      - jitomate
      - arroz_rojo
    technique: albóndigas en salsa chipotle servidas sobre cama de arroz rojo
    description_es: >
      Albóndigas bañadas en salsa chipotle servidas con arroz rojo.
    description_en: >
      Chipotle-sauced meatballs served over Mexican red rice.
  en_salsa_roja:
    name_es: Albóndigas en salsa roja
    name_en: Meatballs in Red Tomato Sauce
    extra_ingredients:
      - jitomate
      - chile_guajillo
    technique: cocción de albóndigas en salsa de jitomate y especias
    description_es: >
      Albóndigas en salsa de jitomate con ajo, cebolla y especias.
    description_en: >
      Tender meatballs simmered in seasoned tomato sauce with garlic, onion, and dried chile.
  en_salsa_verde:
    name_es: Albóndigas en salsa verde
    name_en: Meatballs in Green Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
    technique: albóndigas cocidas en salsa verde de tomatillo
    description_es: >
      Albóndigas en salsa verde de tomatillo.
    description_en: >
      Meatballs simmered in tangy green tomatillo sauce.
  rellenas_de_huevo:
    name_es: Albóndigas rellenas de huevo
    name_en: Stuffed Meatballs with Egg
    extra_ingredients:
      - huevo_cocido
      - salsa_roja
    technique: huevo cocido incrustado en el centro de cada albóndiga antes de cocinar
    description_es: >
      Albóndigas grandes rellenas con huevo cocido en el centro, en salsa roja o caldo.
    description_en: >
      Large meatballs with a hard-boiled egg in the center, cooked in red sauce or broth.
  en_mole:
    name_es: Albóndigas en mole
    name_en: Meatballs in Mole Sauce
    extra_ingredients:
      - mole
      - queso_fresco
      - crema
      - ajonjoli
    technique: albóndigas cocidas y bañadas en mole espeso
    description_es: >
      Albóndigas bañadas en mole espeso con queso, crema y ajonjolí.
    description_en: >
      Meatballs bathed in thick mole sauce, topped with crema, cheese, and sesame seeds.
  de_pollo:
    name_es: Albóndigas de pollo
    name_en: Chicken Meatballs
    extra_ingredients:
      - pollo_molido
      - arroz
      - verduras
    technique: albóndigas elaboradas con pollo molido
    description_es: >
      Albóndigas elaboradas con carne de pollo molida.
    description_en: >
      Meatballs made with ground chicken, typically served in broth or sauce.
  a_la_jardinera:
    name_es: Albóndigas a la jardinera
    name_en: Meatballs with Mixed Vegetables
    extra_ingredients:
      - zanahoria
      - chayote
      - papa
      - ejotes
    technique: albóndigas cocidas con verduras mixtas en salsa ligera
    description_es: >
      Albóndigas con zanahoria, chayote, papa y ejotes en caldillo.
    description_en: >
      Meatballs with carrot, chayote, potato, and green beans in light tomato broth.
  de_res:
    name_es: Albóndigas de res
    name_en: Beef Meatballs
    extra_ingredients:
      - res_molida
      - arroz
      - jitomate
    technique: albóndigas elaboradas con res molida
    description_es: >
      Albóndigas de res en caldo de jitomate con verduras.
    description_en: >
      Beef meatballs cooked in tomato broth with vegetables.
  mixtas:
    name_es: Albóndigas mixtas
    name_en: Mixed Beef and Pork Meatballs
    extra_ingredients:
      - carne_molida_de_res
      - carne_molida_de_cerdo
    technique: mezcla de carne de res y cerdo molida
    description_es: >
      Albóndigas de mezcla de res y cerdo.
    description_en: >
      Meatballs made from a blend of ground beef and pork.
  vegetarianas:
    name_es: Albóndigas vegetarianas
    name_en: Vegetarian Meatballs
    extra_ingredients:
      - soya
      - verduras
    technique: albóndigas elaboradas sin carne animal
    description_es: >
      Albóndigas elaboradas sin carne, con proteína vegetal y verduras.
    description_en: >
      Meatless meatballs made with plant-based protein and vegetables.
  de_pescado:
    name_es: Albóndigas de pescado
    name_en: Fish Meatballs
    extra_ingredients:
      - pescado
      - huevo
      - pan_molido
    technique: albóndigas elaboradas con pescado molido
    description_es: >
      Albóndigas elaboradas con pescado molido y especias.
    description_en: >
      Fish meatballs bound with egg and breadcrumbs, cooked in broth or sauce.
  en_salsa_de_cerveza:
    name_es: Albóndigas en salsa de cerveza
    name_en: Meatballs in Beer Sauce
    extra_ingredients:
      - cerveza
      - jitomate
    technique: albóndigas cocidas en salsa de jitomate con cerveza
    description_es: >
      Albóndigas en salsa ligera de jitomate con cerveza.
    description_en: >
      Homestyle meatballs simmered in a light tomato-beer sauce.
