      - arroz
    technique: 
    description_es: >
      Albóndigas en salsa verde de tomatillo.
    description_en: >
      Albóndigas en salsa verde de tomatillo.
  en_caldo:
    name_es: Albóndigas en caldo
    name_en: Meatball Soup
    extra_ingredients:
