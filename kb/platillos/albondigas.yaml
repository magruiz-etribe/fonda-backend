canonical_name: albondigas
common_names:
  - albóndigas
  - albondigas
  - sopa de albóndigas
  - albóndigas en chipotle
  - albóndigas en salsa roja
  - albóndigas en salsa verde
  - albóndigas en caldo
  - albóndigas en mole
category: guisado
base_ingredients:
  - carne_molida
  - huevo
  - pan_molido
  - ajo
  - cebolla
  - sal
  - pimienta
  - cilantro
variants:
  en_chipotle:
    name_es: Albóndigas en Chipotle
    name_en: Chipotle Meatballs
    extra_ingredients:
      - chile_chipotle
      - jitomate
      - crema
    technique: albóndigas cocidas en salsa cremosa o caldosa de chipotle
    description_es: >
      Albóndigas de carne molida cocidas en salsa de jitomate y chile
      chipotle; sabor ahumado y ligeramente picante.
    description_en: >
      Ground meat meatballs simmered in a tomato and chipotle chile sauce —
      smoky and mildly spicy.
  sopa:
    name_es: Sopa de Albóndigas
    name_en: Mexican Meatball Soup
    extra_ingredients:
      - arroz
      - zanahoria
      - calabaza
      - jitomate
      - menta
    technique: albóndigas cocidas directamente en caldo de verduras o jitomate
    description_es: >
      Caldo tradicional con albóndigas pequeñas de carne y arroz, con
      zanahoria, calabaza y jitomate.
    description_en: >
      Traditional broth with small ground meat and rice meatballs, carrot,
      zucchini, and tomato.
  con_arroz:
    name_es: Albóndigas al Chipotle con Arroz
    name_en: Chipotle Meatballs with Red Rice
    extra_ingredients:
      - chile_chipotle
      - jitomate
      - arroz_rojo
    technique: albóndigas en salsa chipotle servidas sobre cama de arroz rojo
    description_es: >
      Albóndigas bañadas en salsa chipotle acompañadas de arroz rojo mexicano.
    description_en: >
      Chipotle meatballs served over Mexican red rice.
  en_salsa_roja:
    name_es: Albóndigas en Salsa Roja
    name_en: Meatballs in Red Tomato Sauce
    extra_ingredients:
      - jitomate
      - chile_guajillo
    technique: cocción de albóndigas en salsa de jitomate y especias
    description_es: >
      Albóndigas suaves cocidas en salsa de jitomate con ajo, cebolla y
      especias mexicanas.
    description_en: >
      Tender meatballs simmered in a seasoned tomato sauce with garlic,
      onion, and Mexican spices.
  en_salsa_verde:
    name_es: Albóndigas en Salsa Verde
    name_en: Meatballs in Green Tomatillo Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
    technique: cocción de albóndigas en salsa verde de tomatillo
    description_es: >
      Albóndigas en salsa de tomate verde y chile serrano; sabor fresco
      y ligeramente ácido.
    description_en: >
      Meatballs in a fresh tomatillo and serrano chile sauce — bright
      and slightly tangy.
  en_caldo:
    name_es: Albóndigas en Caldo
    name_en: Meatballs in Broth
    extra_ingredients:
      - zanahoria
      - papa
      - cilantro
      - hierba_buena
    technique: cocción de albóndigas directamente en caldo ligero
    description_es: >
      Albóndigas y verduras cocidas en caldo ligero; versión caldosa y
      reconfortante.
    description_en: >
      Meatballs and vegetables simmered in a light broth — the brothiest,
      most comforting version.
  rellenas_de_huevo:
    name_es: Albóndigas Rellenas de Huevo
    name_en: Egg-Stuffed Meatballs
    extra_ingredients:
      - huevo_cocido
      - salsa_roja
    technique: huevo cocido incrustado en el centro de cada albóndiga antes de cocinar
    description_es: >
      Albóndigas grandes con huevo cocido en el centro, cocinadas en
      salsa roja o caldo.
    description_en: >
      Large meatballs with a whole hard-boiled egg hidden in the center,
      cooked in red sauce or broth.
  en_mole:
    name_es: Albóndigas en Mole
    name_en: Meatballs in Mole Sauce
    extra_ingredients:
      - mole
      - queso_fresco
      - crema
      - ajonjoli
    technique: albóndigas cocidas y bañadas en mole espeso
    description_es: >
      Albóndigas cubiertas con mole espeso y especiado; sabor profundo y
      complejo.
    description_en: >
      Meatballs bathed in thick, richly spiced mole sauce — deeply complex
      flavor.
  de_pollo:
    name_es: Albóndigas de Pollo
    name_en: Chicken Meatballs
    extra_ingredients:
      - pollo_molido
      - salsa_roja
    technique: misma técnica pero con carne molida de pollo
    description_es: >
      Albóndigas preparadas con pollo molido; más ligeras que las de res,
      en salsa roja o verde.
    description_en: >
      Meatballs made with ground chicken — lighter than beef, served in
      red or green sauce.
