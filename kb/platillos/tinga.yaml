canonical_name: tinga
common_names:
  - tinga
  - tinga de pollo
  - tinga de res
  - tinga de cerdo
  - tostadas de tinga
category: guisado
base_ingredients:
  - carne_deshebrada
  - jitomate
  - cebolla
  - chile_chipotle
  - aceite
  - sal_y_pimienta
variants:
  de_pollo:
    name_es: Tinga de pollo
    name_en: Chicken Tinga
    extra_ingredients:
      - pollo_deshebrado
    technique: pollo deshebrado cocinado con cebolla y chipotle en salsa de jitomate
    description_es: >
      Pollo deshebrado en salsa de chipotle y jitomate.
    description_en: >
      Shredded chicken braised with onion and chipotle in a tomato sauce — smoky, tangy, and slightly spicy.
  de_res:
    name_es: Tinga de res
    name_en: Beef Tinga
    extra_ingredients:
      - res_deshebrada
    technique: res deshebrada cocinada con cebolla y chipotle
    description_es: >
      Carne de res deshebrada en chipotle.
    description_en: >
      Shredded beef simmered with onion and chipotle in tomato — a hearty tinga variation.
  de_cerdo:
    name_es: Tinga de cerdo
    name_en: Pork Tinga
    extra_ingredients:
      - carne_de_cerdo
    technique: cerdo desmenuzado cocinado con jitomate y chipotle
    description_es: >
      Carne de cerdo desmenuzada cocinada con jitomate y chipotle.
    description_en: >
      Shredded pork cooked with tomato, onion, and chipotle in the classic tinga style.
