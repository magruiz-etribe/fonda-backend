  de_huevo_con_jitomate:
    name_es: Tacos de huevo con jitomate
    name_en: Tomato Egg Tacos
    extra_ingredients:
      - huevo
      - jitomate
      - cebolla
      - tortilla
    technique: 
    description_es: >
      Tacos sencillos de huevo revuelto con jitomate y cebolla.
    description_en: >
      Tacos sencillos de huevo revuelto con jitomate y cebolla.
  de_huevo_con_chorizo_verde:
    name_es: Tacos de huevo con chorizo verde
    name_en: Green Chorizo Egg Tacos
    extra_ingredients:
      - huevo
      - chorizo_verde
      - tortilla
    technique: 
    description_es: >
      Tacos de huevo con chorizo verde típico del centro de México.
    description_en: >
      Tacos de huevo con chorizo verde típico del centro de México.
  de_huevo_con_nopales:
    name_es: Tacos de huevo con nopales
    name_en: Egg and Cactus Tacos
