canonical_name: huevo
common_names:
  - huevos rancheros
  - huevos a la mexicana
  - huevos con chorizo
  - huevos divorciados
  - huevos motuleños
  - huevos tirados
  - huevos estrellados
  - huevos revueltos
  - huevos con jamón
  - huevos con salchicha
  - huevos en salsa
  - huevos en ahogados
  - huevos con nopales
  - huevos con tocino
  - omelette
category: platillo_principal
base_ingredients:
  - huevo
  - aceite
  - sal
  - pimienta
variants:
  rancheros:
    name_es: Huevos rancheros
    name_en: Ranch-style Eggs
    extra_ingredients:
      - tortilla_de_maiz
      - salsa_roja
      - frijoles
      - queso_fresco
      - aguacate
    technique: huevos estrellados sobre tortilla frita bañados en salsa roja
    description_es: >
      Huevos estrellados sobre tortilla frita bañados en salsa ranchera.
    description_en: >
      Fried eggs on a crisp corn tortilla bathed in ranchera salsa — served with beans and cheese.
  a_la_mexicana:
    name_es: Huevos a la mexicana
    name_en: Mexican-style Scrambled Eggs
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_serrano
    technique: huevos revueltos con jitomate, cebolla y chile verde picados
    description_es: >
      Huevos revueltos con jitomate, cebolla y chile.
    description_en: >
      Scrambled eggs with diced tomato, onion, and serrano chile — fresh and colorful.
  con_chorizo:
    name_es: Huevos con chorizo
    name_en: Eggs with Chorizo
    extra_ingredients:
      - chorizo
      - cebolla
    technique: chorizo frito desmoronado mezclado con huevos revueltos
    description_es: >
      Huevos revueltos mezclados con chorizo mexicano frito.
    description_en: >
      Scrambled eggs mixed with crumbled fried Mexican chorizo — bold and spicy.
  divorciados:
    name_es: Huevos divorciados
    name_en: Divorced Eggs
    extra_ingredients:
      - salsa_roja
      - salsa_verde
      - tortilla_de_maiz
      - frijoles
    technique: dos huevos estrellados, cada uno bañado con una salsa diferente
    description_es: >
      Dos huevos estrellados con salsa roja y verde por separado.
    description_en: >
      Two fried eggs on tortillas — one in red salsa, one in green, kept apart on the plate.
  motulenos:
    name_es: Huevos motuleños
    name_en: Motuleño Eggs
    extra_ingredients:
      - tortilla_de_maiz
      - frijoles
      - jamon
      - chicharos
      - platano_frito
      - salsa_roja
    technique: tortillas con frijoles, huevos estrellados, jamón y salsa de jitomate
    description_es: >
      Platillo yucateco con huevos, frijoles, jamón, chícharos y plátano frito.
    description_en: >
      Yucatecan breakfast of fried eggs on beans with ham, peas, fried plantain, and tomato sauce.
  tirados:
    name_es: Huevos tirados
    name_en: Broken Eggs
    extra_ingredients:
      - tortilla_de_maiz
      - salsa
      - chile_seco
    technique: huevos revueltos con tortilla frita troceada y salsa
    description_es: >
      Huevos revueltos con tortilla frita troceada y salsa.
    description_en: >
      Scrambled eggs with crispy torn fried tortilla and salsa — crunchy and savory.
  estrellados:
    name_es: Huevos estrellados
    name_en: Fried Eggs
    extra_ingredients:
      - frijoles
      - tocino
      - jamon
    technique: huevo frito entero con la yema líquida o cocida al gusto
    description_es: >
      Huevos fritos enteros, con yema líquida o cocida al gusto.
    description_en: >
      Sunny-side or over-easy fried eggs — served with beans, tortillas, and salsa.
  revueltos:
    name_es: Huevos revueltos
    name_en: Scrambled Eggs
    extra_ingredients:
      - jamon
      - salchicha
      - queso
    technique: huevos batidos cocinados revolviendo constantemente en sartén
    description_es: >
      Huevos batidos cocinados en sartén; opcional jamón, queso o verduras.
    description_en: >
      Softly scrambled eggs — optionally with ham, cheese, sausage, or vegetables.
  omelette:
    name_es: Omelette
    name_en: Omelet
    extra_ingredients:
      - queso
      - jamon
      - champinones
    technique: huevo batido cocido en lámina y doblado sobre el relleno
    description_es: >
      Huevo batido cocido en lámina doblada, relleno de queso, jamón o verduras.
    description_en: >
      Beaten egg cooked flat and folded over cheese, ham, mushrooms, or vegetables.
  con_jamon:
    name_es: Huevos con jamón
    name_en: Eggs with Ham
    extra_ingredients:
      - jamon
      - cebolla
    technique: huevos revueltos con jamón picado
    description_es: >
      Huevos revueltos con jamón picado.
    description_en: >
      Scrambled eggs with diced ham — a simple fonda breakfast staple.
  en_salsa:
    name_es: Huevos en salsa
    name_en: Eggs in Salsa
    extra_ingredients:
      - salsa_verde
      - salsa_roja
      - frijoles
    technique: huevos revueltos o estrellados bañados en salsa verde o roja
    description_es: >
      Huevos bañados en salsa verde o roja, servidos con frijoles.
    description_en: >
      Scrambled or fried eggs bathed in green or red salsa — intensely flavored.
  con_salchicha:
    name_es: Huevos con salchicha
    name_en: Eggs with Sausage
    extra_ingredients:
      - salchicha
      - cebolla
    technique: huevos revueltos con salchicha
    description_es: >
      Huevos revueltos combinados con salchicha en rodajas o picada.
    description_en: >
      Scrambled eggs combined with sliced or chopped sausage.
  en_ahogados:
    name_es: Huevos en ahogados
    name_en: Smothered Eggs
    extra_ingredients:
      - salsa
      - frijoles
    technique: huevos estrellados cocidos directamente en salsa caliente
    description_es: >
      Huevos estrellados cocidos en salsa caliente hasta quedar enchilados.
    description_en: >
      Fried eggs poached directly in hot salsa until fully smothered.
  con_nopales:
    name_es: Huevos con nopales
    name_en: Eggs with Cactus
    extra_ingredients:
      - nopales
      - salsa
    technique: huevos revueltos o estrellados cocinados con nopales tiernos
    description_es: >
      Huevos cocinados con nopales tiernos.
    description_en: >
      Eggs scrambled or fried with tender cactus paddles — light and earthy.
  con_tocino:
    name_es: Huevos con tocino
    name_en: Eggs with Bacon
    extra_ingredients:
      - tocino
      - salsa
      - frijoles
    technique: huevos revueltos o estrellados con tocino crujiente
    description_es: >
      Huevos acompañados o mezclados con tocino crujiente.
    description_en: >
      Eggs served with or mixed into crispy bacon — rich and savory.
