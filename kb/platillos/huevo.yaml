variants:
  rancheros:
    name_es: Huevos rancheros
    name_en: Ranch-style eggs
    extra_ingredients:
      - tortilla_de_maiz
      - salsa_roja
      - frijoles
      - queso_fresco
      - aguacate
      - huevo
      - tortilla
      - jitomate
      - chile
    technique: huevos estrellados sobre tortilla frita bañados en salsa roja
    description_es: >
      Huevos servidos sobre tortilla y bañados en salsa ranchera.
    description_en: >
      Huevos servidos sobre tortilla y bañados en salsa ranchera.
  a_la_mexicana:
    name_es: Huevos a la mexicana
    name_en: Mexican-style scrambled eggs
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_serrano
      - huevo
      - chile
    technique: huevos revueltos con jitomate, cebolla y chile verde picados
    description_es: >
      Huevos revueltos con jitomate, cebolla y chile.
    description_en: >
      Huevos revueltos con jitomate, cebolla y chile.
  con_chorizo:
    name_es: Huevos con Chorizo
    name_en: Eggs with chorizo
    extra_ingredients:
      - chorizo
      - cebolla
    technique: chorizo frito desmoronado mezclado con huevos revueltos
    description_es: >
      Huevos revueltos mezclados con chorizo mexicano previamente frito. Se suele acompañar con tortillas de maíz y frijoles.
    description_en: >
      Scrambled eggs mixed with crumbled fried Mexican chorizo and onion — bold and spicy.
  divorciados:
    name_es: Huevos divorciados
    name_en: Divorced eggs
    extra_ingredients:
      - salsa_roja
      - salsa_verde
      - tortilla_de_maiz
      - frijoles
      - huevo
    technique: dos huevos estrellados, cada uno bañado con una salsa diferente
    description_es: >
      Dos huevos servidos con salsa roja y verde por separado.
    description_en: >
      Dos huevos servidos con salsa roja y verde por separado.
  motulenos:
    name_es: Huevos motuleños
    name_en: Motuleño eggs
    extra_ingredients:
      - tortilla_de_maiz
      - frijoles
      - jamon
      - chicharos
      - platano_frito
      - salsa_roja
      - huevo
      - tortilla
    technique: tortillas con frijoles, huevos estrellados y salsa de jitomate
    description_es: >
      Platillo yucateco con huevos, tortilla, frijoles y salsa.
    description_en: >
      Platillo yucateco con huevos, tortilla, frijoles y salsa.
  tirados:
    name_es: Huevos Tirados
    name_en: Broken eggs
    extra_ingredients:
      - tortilla_de_maiz
      - salsa
      - chile_seco
    technique: huevos revueltos con tortilla frita troceada y salsa
    description_es: >
      huevos revueltos con tortilla frita troceada y salsa
    description_en: >
      Scrambled eggs cooked with crispy torn fried tortilla pieces and salsa — a crunchier take on scrambled eggs.
  estrellados:
    name_es: Huevos Estrellados
    name_en: Fried eggs
    extra_ingredients:
      - frijoles
      - tocino
      - jamon
    technique: huevo frito entero con la yema líquida o cocida al gusto
    description_es: >
      Huevos fritos servidos enteros, con la yema líquida o cocida según preferencia. Se acompañan comúnmente con frijoles, tortillas y salsa.
    description_en: >
      Whole fried eggs with runny or set yolk as preferred — served with beans, tortillas, and salsa.
  revueltos:
    name_es: Huevos Revueltos
    name_en: Scrambled Eggs
    extra_ingredients:
      - jamon
      - salchicha
      - queso
    technique: huevos batidos cocinados revolviendo constantemente en sartén
    description_es: >
      Huevos batidos cocinados en sartén; opcional jamón, queso o verduras.
    description_en: >
      Softly scrambled eggs — can include ham, cheese, sausage, or other mix-ins.
  omelette:
    name_es: Omelette
    name_en: Omelet
    extra_ingredients:
      - queso
      - jamon
      - champinones
    technique: huevo batido cocido en lámina y doblado sobre el relleno
    description_es: >
      Huevo batido cocido en forma de lámina doblada, generalmente relleno de queso, jamón, champiñones o verduras.
    description_en: >
      Beaten egg cooked flat and folded over a filling of cheese, ham, mushrooms, or vegetables.
  con_jamon:
    name_es: Huevos con jamón
    name_en: Eggs in sauce
    extra_ingredients:
      - jamon
      - cebolla
      - huevo
    technique: huevos revueltos con jamón picado
    description_es: >
      Huevos revueltos con jamón picado.
    description_en: >
      Huevos revueltos con jamón picado.
  en_salsa:
    name_es: Huevos en Salsa
    name_en: Eggs in Salsa
    extra_ingredients:
      - salsa_verde
      - salsa_roja
      - frijoles
    technique: huevos revueltos o pochados bañados en salsa verde o roja
    description_es: >
      huevos revueltos bañados en salsa verde o roja, generalmente servidos con frijoles
    description_en: >
      Scrambled or poached eggs bathed in green or red salsa — intensely flavored.
  con_salchicha:
    name_es: Huevos con Salchicha
    name_en: Eggs with sausage
    extra_ingredients:
      - salchicha
      - cebolla
    technique: huevos revueltos con salchicha
    description_es: >
      Huevos revueltos combinados con salchicha en rodajas o picada.
    description_en: >
      Scrambled eggs combined with sliced or chopped sausage.
  chilaquiles_con_huevo:
    name_es: Chilaquiles con Huevo
    name_en: Chilaquiles with eggs
    extra_ingredients:
      - totopos
      - salsa
      - crema
      - queso
      - huevo
    technique: totopos en salsa con huevo estrellado o revuelto
    description_es: >
      Totopos de maíz bañados en salsa roja o verde, acompañados con huevos estrellados o revueltos. Se sirven con crema, queso, cebolla
    description_en: >
      Corn totopos in red or green salsa with fried or scrambled eggs, served with cream, cheese, and onion.
  molletes_con_huevo:
    name_es: Molletes con Huevo
    name_en: Open-faced beans and cheese bread with eggs
    extra_ingredients:
      - pan
      - frijoles
      - queso
      - huevo
    technique: bolillo con frijoles, queso gratinado y huevo
    description_es: >
      Bolillo abierto con frijoles refritos y queso gratinado, acompañado de huevo preparado al gusto
    description_en: >
      Open bolillo roll with refried beans and melted cheese, served with eggs prepared to taste.
  torta_de_huevo:
    name_es: Torta de Huevo
    name_en: Egg sandwich
    extra_ingredients:
      - bolillo
      - mayonesa
      - aguacate
      - huevo
    technique: bolillo relleno de huevo revuelto o frito
    description_es: >
      Pan tipo bolillo relleno de huevo revuelto o frito, a veces acompañado de mayonesa, aguacate o frijoles.
    description_en: >
      Bolillo roll filled with scrambled or fried eggs, sometimes with mayonnaise, avocado, or beans.
  en_ahogados:
    name_es: Huevos En Ahogados
    name_en: Smothered Eggs
    extra_ingredients:
      - salsa
      - frijoles
    technique: huevos cocidos directamente en salsa caliente
    description_es: >
      Huevos cocidos directamente en salsa caliente.
    description_en: >
      Eggs cooked directly in hot salsa.
  con_nopales:
    name_es: Huevos Con Nopales
    name_en: Eggs with Cactus
    extra_ingredients:
      - nopales
      - salsa
    technique: huevos cocinados con nopales tiernos
    description_es: >
      Huevos cocinados con nopales tiernos.
    description_en: >
      Eggs cooked with tender cactus paddles.
  con_tocino:
    name_es: Huevos Con Tocino
    name_en: Eggs with Bacon
    extra_ingredients:
      - tocino
      - salsa
      - frijoles
    technique: huevos con tocino crujiente
    description_es: >
      Huevos acompañados o mezclados con tocino crujiente.
    description_en: >
      Eggs served with or mixed with crispy bacon.
  ejotes_con_huevo:
    name_es: Ejotes con huevo
    name_en: Green Beans with Eggs
    extra_ingredients:
      - ejotes
      - huevo
      - cebolla
    technique: 
    description_es: >
      Ejotes salteados mezclados con huevo revuelto.
    description_en: >
      Ejotes salteados mezclados con huevo revuelto.
  de_huevo_con_chorizo:
    name_es: Tacos de huevo con chorizo
    name_en: Egg and Chorizo Tacos
    extra_ingredients:
      - huevo
      - chorizo
      - tortilla
    technique: 
    description_es: >
      Tacos de huevo revuelto con chorizo.
    description_en: >
      Tacos de huevo revuelto con chorizo.
  de_huevo_con_papa:
    name_es: Tacos de huevo con papa
    name_en: Egg and Potato Tacos
    extra_ingredients:
      - huevo
      - papa
      - tortilla
    technique: 
    description_es: >
      Tacos de huevo revuelto con papa.
