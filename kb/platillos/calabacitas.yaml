canonical_name: calabacitas
common_names:
  - Tacos de calabacitas con crema
category: guisado
base_ingredients:
  - calabaza
  - cebolla
  - ajo
  - sal
  - aceite
variants:
  a_la_mexicana:
    name_es: Calabacitas a la mexicana
    name_en: Mexican-Style Zucchini
    extra_ingredients:
      - calabaza
      - jitomate
      - cebolla
      - chile
    technique: 
    description_es: >
      Calabazas salteadas con jitomate, cebolla y chile.
    description_en: >
      Mexican-Style Zucchini made with zucchini, tomato, onion and chile.
  con_puerco:
    name_es: Calabacitas con Puerco
    name_en: Zucchini with Pork Stew
    extra_ingredients:
      - carne_de_cerdo
      - jitomate
      - elote
    technique: sofrito de carne de cerdo con calabaza y jitomate
    description_es: >
      Guiso de calabaza picada con granos de elote y trozos de carne de cerdo.
    description_en: >
      Zucchini and corn kernel stew with chunks of pork in tomato sauce — hearty and home-cooked.
  con_queso:
    name_es: Calabacitas con queso
    name_en: Zucchini with Cheese
    extra_ingredients:
      - calabaza
      - queso_panela
      - cebolla
    technique: 
    description_es: >
      Calabacitas cocinadas con queso fresco o panela.
    description_en: >
      Calabacitas cocinadas with cheese fresh or panela.
  con_elote:
    name_es: Calabacitas con elote
    name_en: Zucchini with Corn
    extra_ingredients:
      - calabaza
      - elote
      - jitomate
      - cebolla
    technique: 
    description_es: >
      Guiso ligero de calabaza y elote.
    description_en: >
      Stew ligero of calabaza and corn.
  con_crema:
    name_es: Calabacitas con crema
    name_en: Zucchini with Cream
    extra_ingredients:
      - calabaza
      - crema
      - elote
    technique: 
    description_es: >
      Guiso suave de calabacitas con crema.
    description_en: >
      Zucchini with Cream made with zucchini, Mexican crema and corn.
