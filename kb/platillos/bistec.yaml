canonical_name: bistec
common_names:
  - bistec
  - bistec encebollado
  - bistec a la mexicana
  - bistec ranchero
  - bistec en salsa de chile pasilla
  - bistec en salsa de chipotle ahumado
  - bistec con nopales en salsa verde
  - bistec con nopales en salsa roja
  - bistec en salsa de cacahuate
category: platillo_principal
base_ingredients:
  - carne_de_res
  - sal
  - pimienta
  - aceite
variants:
  encebollado:
    name_es: Bistec encebollado
    name_en: Steak with Onions
    extra_ingredients:
      - cebolla
      - ajo
    technique: bistec salteado con cebolla
    description_es: >
      Bistec de res salteado con cebolla.
    description_en: >
      Thin beef steak pan-fried with sliced onions until tender.
  a_la_mexicana:
    name_es: Bistec a la mexicana
    name_en: Mexican-Style Beef Steak
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_jalapeno_o_serrano
    technique: bistec guisado con jitomate, cebolla y chile
    description_es: >
      Bistec con jitomate, cebolla y chile.
    description_en: >
      Beef steak cooked with tomato, onion, and fresh chile — classic a la mexicana style.
  ranchero:
    name_es: Bistec ranchero
    name_en: Ranch-Style Steak
    extra_ingredients:
      - jitomate
      - chile_jalapeno
    technique: bistec cocinado en salsa de jitomate y chile
    description_es: >
      Carne de res cocinada en salsa de jitomate y chile.
    description_en: >
      Beef steak braised in a rustic tomato and jalapeño ranchero sauce.
  en_salsa_de_chile_pasilla:
    name_es: Bistec en salsa de chile pasilla
    name_en: Steak in Pasilla Sauce
    extra_ingredients:
      - chile_pasilla
      - jitomate
    technique: bistec guisado en salsa de chile pasilla
    description_es: >
      Bistec de res en salsa de chile pasilla.
    description_en: >
      Beef steak simmered in a deep, mildly smoky pasilla chile sauce.
  en_salsa_de_chipotle_ahumado:
    name_es: Bistec en salsa de chipotle ahumado
    name_en: Steak in Smoked Chipotle Sauce
    extra_ingredients:
      - chipotle
      - crema
      - jitomate
    technique: bistec en salsa cremosa de chipotle ahumado
    description_es: >
      Carne de res en salsa chipotle cremosa.
    description_en: >
      Beef steak in a creamy smoked chipotle and tomato sauce.
  con_nopales_en_salsa_verde:
    name_es: Bistec con nopales en salsa verde
    name_en: Steak with Cactus in Green Sauce
    extra_ingredients:
      - nopal
      - tomatillo
      - chile_serrano
    technique: bistec guisado con nopales en salsa verde
    description_es: >
      Bistec de res guisado con nopales en salsa verde.
    description_en: >
      Beef steak stewed with cactus paddles in a green tomatillo sauce.
  con_nopales_en_salsa_roja:
    name_es: Bistec con nopales en salsa roja
    name_en: Steak with Cactus in Red Sauce
    extra_ingredients:
      - nopal
      - chile_guajillo
      - jitomate
    technique: bistec guisado con nopales en salsa roja
    description_es: >
      Bistec en salsa roja con nopales cocidos.
    description_en: >
      Beef steak in red chile-tomato sauce with tender stewed cactus paddles.
  en_salsa_de_cacahuate:
    name_es: Bistec en salsa de cacahuate
    name_en: Steak in Peanut Sauce
    extra_ingredients:
      - cacahuate
      - chile_guajillo
      - jitomate
    technique: bistec en salsa espesa de cacahuate
    description_es: >
      Bistec en salsa espesa de cacahuate.
    description_en: >
      Beef steak in a rich, nutty peanut and dried-chile sauce.
