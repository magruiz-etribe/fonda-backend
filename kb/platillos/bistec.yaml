canonical_name: bistec
common_names:
  - bistec
  - bistec encebollado
  - bistec a la mexicana
category: platillo_principal
base_ingredients:
  - carne_de_res
  - sal
  - pimienta
  - aceite
variants:
  encebollado:
    name_es: Bistec Encebollado
    name_en: Steak with Onions
    extra_ingredients:
      - cebolla
      - ajo
    technique: sellado de la carne, sofrito de cebolla hasta caramelizar
    description_es: >
      Carne de res cocinada con cebolla salteada.
    description_en: >
      Pan-seared beef steak served with slowly caramelized onions — simple and beloved in traditional Mexican diners.
  a_la_mexicana:
    name_es: Bistec a la Mexicana
    name_en: Mexican-Style Steak
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_serrano
      - cilantro
      - ajo
    technique: salteado de carne con jitomate, cebolla y chile verde
    description_es: >
      Tiras de carne de res salteadas con jitomate, cebolla y chile verde.
    description_en: >
      Strips of beef stir-fried with tomato, onion, and green chile — fresh flavors that mirror the colors of the Mexican flag.
