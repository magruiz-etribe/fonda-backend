canonical_name: papas
common_names:
  - papas con chorizo
  - papas a la francesa
  - papas en salsa verde
  - papas en salsa roja
category: guarnicion
base_ingredients:
  - papas
  - aceite
  - sal
variants:
  con_chorizo:
    name_es: Papas con chorizo
    name_en: Potatoes with Chorizo
    extra_ingredients:
      - chorizo
      - cebolla
      - salsa
    technique: papas cocidas y salteadas con chorizo
    description_es: >
      Cubos de papa cocidos y salteados con chorizo de cerdo picado.
    description_en: >
      Diced potatoes cooked and sautéed with crumbled pork chorizo and onion.
  a_la_francesa:
    name_es: Papas a la francesa
    name_en: French Fries
    extra_ingredients:
      - sal
    technique: papas fritas en aceite caliente
    description_es: >
      Papas cortadas en tiras o cubos y fritas en aceite caliente hasta quedar crujientes.
    description_en: >
      Potatoes cut into strips or cubes and deep-fried until golden and crisp.
  en_salsa_verde:
    name_es: Papas en salsa verde
    name_en: Potatoes in Green Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
    technique: papas cocidas en salsa verde de tomatillo
    description_es: >
      Papas cocidas en salsa verde de tomatillo.
    description_en: >
      Potatoes simmered in a tangy green tomatillo and serrano chile sauce.
  en_salsa_roja:
    name_es: Papas en salsa roja
    name_en: Potatoes in Red Sauce
    extra_ingredients:
      - jitomate
      - chile_guajillo
    technique: papas cocidas en salsa roja de jitomate
    description_es: >
      Papas en salsa roja casera.
    description_en: >
      Potatoes cooked in a homestyle red tomato and guajillo chile sauce.
