canonical_name: aguas_frescas
common_names:
  - agua fresca
  - agua
  - aguas frescas
  - jamaica
  - horchata
  - agua de limón
  - agua de pepino
category: bebida
base_ingredients:
  - agua
  - azucar
variants:
  jamaica:
    name_es: Agua de Jamaica
    name_en: Hibiscus water
    extra_ingredients:
      - flor_de_jamaica
    technique: infusión de flor de jamaica en agua caliente, endulzado y enfriado
    description_es: >
      Hecha con flor de jamaica
    description_en: >
      Hibiscus flower infused water, sweetened and chilled — deep red color with a floral, slightly tart flavor.
  horchata:
    name_es: Horchata
    name_en: Horchata
    extra_ingredients:
      - arroz
      - canela
      - vainilla
      - leche
      - nuez
    technique: remojo y licuado de arroz con canela, colado y endulzado
    description_es: >
      Normalmente hecha con arroz, canela y vainilla
    description_en: >
      Creamy rice-based drink blended with cinnamon and vanilla — sweet, milky, and refreshing.
  limon_con_chia:
    name_es: Agua de Limón con Chía
    name_en: Lime chia water
    extra_ingredients:
      - limon
      - semillas_de_chia
    technique: jugo de limón con agua, azúcar y semillas de chía hidratadas
    description_es: >
      Bebida de limón con semillas de chía
    description_en: >
      Fresh lime water with hydrated chia seeds — refreshing, lightly tart, with the characteristic texture of chia.
  pepino_con_limon:
    name_es: Agua de Pepino con Limón
    name_en: Red Chilaquiles
    extra_ingredients:
      - pepino
      - limon
    technique: licuado de pepino con agua y limón, colado
    description_es: >
      Hecha con pepino y limón
    description_en: >
      Blended cucumber and lime water — refreshing, light, and clean-flavored.
