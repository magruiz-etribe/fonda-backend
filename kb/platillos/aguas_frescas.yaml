canonical_name: aguas_frescas
common_names:
  - agua fresca
  - aguas frescas
  - agua de jamaica
  - horchata
  - agua de tamarindo
  - agua de limón
  - agua de pepino
  - agua de melón
  - agua de sandía
  - agua de guayaba
  - agua de piña
  - agua de avena
  - agua de cebada
  - agua de mamey
  - agua de papaya
  - agua de coco
  - agua de fresa
  - agua de naranja
  - agua de toronja
  - agua de lima
  - agua de guanábana
  - agua de mango
  - agua de tuna
  - agua de nopal
  - agua de plátano
  - agua de chocolate frío
  - agua de café frío
category: bebida
base_ingredients:
  - agua
  - azucar
variants:
  jamaica:
    name_es: Agua de jamaica
    name_en: Hibiscus Agua Fresca
    extra_ingredients:
      - flor_de_jamaica
      - canela
      - naranja
    technique: infusión de flor de jamaica en agua caliente, endulzado y enfriado
    description_es: >
      Bebida fría de flor de jamaica, roja y ligeramente ácida.
    description_en: >
      Chilled hibiscus flower drink — deep red, floral, and lightly tart.
  horchata:
    name_es: Horchata
    name_en: Rice Horchata
    extra_ingredients:
      - arroz
      - canela
      - vainilla
      - leche
      - fresa
      - coco
      - cafe
    technique: remojo y licuado de arroz con canela, colado y endulzado
    description_es: >
      Bebida cremosa de arroz con canela; a veces con fresa, coco o café.
    description_en: >
      Creamy rice drink blended with cinnamon and vanilla — sometimes with strawberry, coconut, or coffee.
  tamarindo:
    name_es: Agua de tamarindo
    name_en: Tamarind Agua Fresca
    extra_ingredients:
      - tamarindo
      - chile_piquin
    technique: pulpa de tamarindo disuelta en agua, endulzada y enfriada
    description_es: >
      Bebida refrescante de tamarindo; opcional con chile en polvo.
    description_en: >
      Sweet-tart tamarind drink — optionally dusted with chile for a spicy kick.
  limon:
    name_es: Agua de limón
    name_en: Lime Agua Fresca
    extra_ingredients:
      - limon
    technique: jugo de limón con agua y azúcar
    description_es: >
      Bebida fresca y cítrica de limón.
    description_en: >
      Fresh lime water — bright, tart, and refreshing.
  limon_con_chia:
    name_es: Agua de limón con chía
    name_en: Lime and Chia Agua Fresca
    extra_ingredients:
      - limon
      - semillas_de_chia
    technique: jugo de limón con agua, azúcar y semillas de chía hidratadas
    description_es: >
      Agua de limón con semillas de chía hidratadas.
    description_en: >
      Lime water with hydrated chia seeds — refreshing with a light gel texture.
  pepino:
    name_es: Agua de pepino
    name_en: Cucumber Agua Fresca
    extra_ingredients:
      - pepino
      - limon
      - semillas_de_chia
      - hierbabuena
    technique: pepino licuado con agua, colado y enfriado
    description_es: >
      Bebida ligera de pepino; común con limón, chía o hierbabuena.
    description_en: >
      Light blended cucumber drink — often served with lime, chia, or mint.
  melon:
    name_es: Agua de melón
    name_en: Melon Agua Fresca
    extra_ingredients:
      - melon
      - leche
      - menta
    technique: pulpa de melón licuada con agua, endulzada y enfriada
    description_es: >
      Bebida dulce de melón; a veces con leche o menta.
    description_en: >
      Sweet melon drink — sometimes made creamy with milk or brightened with mint.
  sandia:
    name_es: Agua de sandía
    name_en: Watermelon Agua Fresca
    extra_ingredients:
      - sandia
      - limon
    technique: sandía licuada con agua, endulzada y enfriada
    description_es: >
      Bebida refrescante de sandía; opcional con limón.
    description_en: >
      Refreshing watermelon drink — optionally finished with a squeeze of lime.
  guayaba:
    name_es: Agua de guayaba
    name_en: Guava Agua Fresca
    extra_ingredients:
      - guayaba
      - canela
    technique: guayaba licuada con agua, endulzada y enfriada
    description_es: >
      Bebida dulce de guayaba; a veces con canela.
    description_en: >
      Sweet guava drink — sometimes spiced with cinnamon.
  pina:
    name_es: Agua de piña
    name_en: Pineapple Agua Fresca
    extra_ingredients:
      - pina
      - coco
    technique: piña licuada con agua, endulzada y enfriada
    description_es: >
      Bebida dulce de piña natural; a veces con coco.
    description_en: >
      Sweet fresh pineapple drink — sometimes blended with coconut.
  fresa:
    name_es: Agua de fresa
    name_en: Strawberry Agua Fresca
    extra_ingredients:
      - fresa
      - leche
    technique: fresas licuadas con agua, endulzadas y enfriadas
    description_es: >
      Bebida dulce de fresa; a veces con leche.
    description_en: >
      Sweet strawberry drink — sometimes made creamy with milk.
  avena:
    name_es: Agua de avena
    name_en: Oat Agua Fresca
    extra_ingredients:
      - avena
      - leche
      - canela
    technique: avena remojada, licuada, colada y endulzada
    description_es: >
      Bebida cremosa de avena licuada con canela.
    description_en: >
      Creamy blended oat drink with cinnamon — hearty and lightly sweet.
  cebada:
    name_es: Agua de cebada
    name_en: Barley Agua Fresca
    extra_ingredients:
      - cebada
    technique: cebada cocida, licuada, colada y endulzada
    description_es: >
      Bebida refrescante elaborada con cebada cocida.
    description_en: >
      Refreshing drink made from cooked barley — mild and lightly sweet.
  mamey:
    name_es: Agua de mamey
    name_en: Mamey Agua Fresca
    extra_ingredients:
      - mamey
      - leche
    technique: pulpa de mamey licuada con agua o leche y endulzada
    description_es: >
      Bebida cremosa hecha con pulpa de mamey.
    description_en: >
      Creamy drink made from mamey sapote pulp — rich and tropical.
  papaya:
    name_es: Agua de papaya
    name_en: Papaya Agua Fresca
    extra_ingredients:
      - papaya
    technique: papaya licuada con agua, endulzada y enfriada
    description_es: >
      Bebida ligera de papaya licuada con agua.
    description_en: >
      Light papaya drink blended with water — smooth and mildly sweet.
  coco:
    name_es: Agua de coco
    name_en: Coconut Agua Fresca
    extra_ingredients:
      - agua_de_coco
      - pulpa_de_coco
    technique: pulpa y agua de coco mezcladas y endulzadas al gusto
    description_es: >
      Bebida refrescante natural elaborada con coco.
    description_en: >
      Refreshing coconut drink made with coconut water and pulp.
  arroz:
    name_es: Agua de arroz
    name_en: Rice Agua Fresca
    extra_ingredients:
      - arroz
      - canela
      - leche
    technique: arroz remojado, licuado, colado y endulzado
    description_es: >
      Bebida ligera de arroz remojado; distinta de la horchata por su textura más acuosa.
    description_en: >
      Light rice drink from soaked blended rice — thinner than horchata.
  naranja:
    name_es: Agua de naranja
    name_en: Orange Agua Fresca
    extra_ingredients:
      - naranja
    technique: jugo de naranja diluido con agua y endulzado
    description_es: >
      Bebida cítrica elaborada con jugo de naranja natural.
    description_en: >
      Citrus drink made with fresh orange juice — bright and sweet-tart.
  toronja:
    name_es: Agua de toronja
    name_en: Grapefruit Agua Fresca
    extra_ingredients:
      - toronja
    technique: jugo de toronja diluido con agua y endulzado
    description_es: >
      Bebida refrescante de toronja natural.
    description_en: >
      Refreshing grapefruit drink — pleasantly bitter and tangy.
  lima:
    name_es: Agua de lima
    name_en: Mexican Lime Agua Fresca
    extra_ingredients:
      - lima
    technique: jugo de lima con agua y azúcar
    description_es: >
      Bebida refrescante preparada con lima agria.
    description_en: >
      Refreshing drink made with Mexican lima — tart and aromatic.
  guanabana:
    name_es: Agua de guanábana
    name_en: Soursop Agua Fresca
    extra_ingredients:
      - guanabana
      - leche
    technique: pulpa de guanábana licuada con agua o leche y endulzada
    description_es: >
      Bebida cremosa y dulce de guanábana.
    description_en: >
      Creamy sweet soursop drink — tropical and fragrant.
  mango:
    name_es: Agua de mango
    name_en: Mango Agua Fresca
    extra_ingredients:
      - mango
    technique: mango licuado con agua, endulzado y enfriado
    description_es: >
      Bebida fresca y dulce de mango, común en fondas.
    description_en: >
      Fresh sweet mango drink — a fonda staple when mangoes are in season.
  tuna:
    name_es: Agua de tuna
    name_en: Prickly Pear Agua Fresca
    extra_ingredients:
      - tuna
    technique: pulpa de tuna licuada con agua, endulzada y enfriada
    description_es: >
      Bebida refrescante de tuna roja o verde.
    description_en: >
      Refreshing prickly pear drink — mild, fruity, and vividly colored.
  nopal:
    name_es: Agua de nopal
    name_en: Cactus Agua Fresca
    extra_ingredients:
      - nopal
      - limon
    technique: nopal licuado con agua y limón, colado y enfriado
    description_es: >
      Bebida refrescante hecha con nopal licuado.
    description_en: >
      Refreshing blended cactus paddle drink — light and slightly tangy with lime.
  platano:
    name_es: Agua de plátano
    name_en: Banana Agua Fresca
    extra_ingredients:
      - platano
      - leche
    technique: plátano licuado con agua o leche y endulzado
    description_es: >
      Bebida espesa de plátano licuado.
    description_en: >
      Thick blended banana drink — smooth and naturally sweet.
  chocolate_frio:
    name_es: Agua de chocolate frío
    name_en: Iced Mexican Chocolate Drink
    extra_ingredients:
      - cacao
      - leche
    technique: cacao disuelto en leche fría con azúcar
    description_es: >
      Bebida fría de cacao estilo mexicano.
    description_en: >
      Chilled Mexican-style chocolate drink — rich and lightly spiced.
  cafe_frio:
    name_es: Agua de café frío
    name_en: Iced Coffee Drink
    extra_ingredients:
      - cafe
    technique: café preparado, endulzado y servido frío
    description_es: >
      Café frío endulzado, común en fondas.
    description_en: >
      Sweet iced coffee — a simple cold option at fondas.
