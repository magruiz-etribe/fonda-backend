# combinacion_estilo is open-ended (any fruit/veg combo a fondero prepares) — the
# list below is suggested quick-reply buttons, not an exhaustive enum. Marking it
# here means any ingredient the user mentions satisfies it, instead of requiring
# an exact match against one of these phrases (see generation._variable_covered).
