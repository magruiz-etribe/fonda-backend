canonical_name: arroz_con_leche
common_names:
  - arroz con leche
category: postre
base_ingredients:
  - arroz
  - leche
  - leche_condensada
  - leche_evaporada
  - azucar
  - canela
  - vainilla
  - agua
variants:
  arroz_con_leche:
    name_es: Arroz con Leche
    name_en: Mexican Rice Pudding
    extra_ingredients:
      - pasitas
      - cascara_de_limon
      - coco_rallado
      - almendra
      - cajeta
    technique: cocción lenta del arroz en leche con canela y azúcar
    description_es: >
      Arroz cocido en leche, azúcar y canela; opcional vainilla, pasas o leche condensada.
    description_en: >
      Rice slow-cooked in milk with cinnamon, sugar, and vanilla until thick and creamy — may include raisins, shredded coconut, or condensed milk.
