canonical_name: huauzontle
common_names:
  - Huazontle en jitomate
category: platillo_principal
base_ingredients:
  - huauzontle
  - jitomate
  - ajo
  - cebolla
  - sal
  - pimienta
  - huevo
  - harina
  - aceite
variants:
  en_jitomate:
    name_es: Huauzontle en Jitomate
    name_en: Huauzontle in Tomato Sauce
    extra_ingredients:
      - queso
    technique: 
    description_es: >
      Huauzontles cocidos preparados en una salsa de jitomate sazonada con ajo, cebolla y especias. Pueden servirse solos o capeados con queso.
    description_en: >
      Huauzontle in Tomato Sauce made with cheese.
  en_pasilla:
    name_es: Huazontle en pasilla
    name_en: Huauzontle in Pasilla Sauce
    extra_ingredients:
      - queso
      - chile_pasilla
    technique: 
    description_es: >
      Planta comestible, parecida al brócoli bañados en una salsa de chile pasilla con jitomate, ajo y especias. En algunas versiones se rellenan con queso y se capeán antes de servirse.
    description_en: >
      Huauzontle in Pasilla Sauce made with cheese and chile pasilla.
  tortitas_de_huauzontle:
    name_es: Tortitas de huauzontle
    name_en: Huauzontle Patties
    extra_ingredients:
      - huauzontle
      - queso
      - huevo
    technique: 
    description_es: >
      Huauzontles capeados y rellenos de queso.
    description_en: >
      Huauzontles capeados and rellenos of cheese.
  huauzontles_en_caldillo:
    name_es: Huauzontles en caldillo
    name_en: Huauzontles in Tomato Sauce
    extra_ingredients:
      - huauzontle
      - jitomate
      - cebolla
    technique: 
    description_es: >
      Huauzontles cocidos y servidos en salsa de jitomate.
    description_en: >
      Huauzontles cocidos and servidos in sauce of tomato.
