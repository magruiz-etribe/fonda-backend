canonical_name: huauzontle
common_names:
  - Huazontle en jitomate
  - Huazontle en pasilla
category: platillo_principal
base_ingredients:
  - huauzontle
  - jitomate
  - ajo
  - cebolla
  - sal
  - pimienta
  - huevo
  - harina
  - aceite
variants:
  en_jitomate:
    name_es: Huauzontle en Jitomate
    name_en: Huauzontle in Tomato Sauce
    extra_ingredients:
      - queso
    technique: 
    description_es: >
      huauzontles cocidos preparados en una salsa de jitomate sazonada con ajo, cebolla y especias. Pueden servirse solos o capeados con queso.
    description_en: >
      huauzontles cocidos preparados en una salsa de jitomate sazonada con ajo, cebolla y especias. Pueden servirse solos o capeados con queso.
  en_pasilla:
    name_es: Huazontle en pasilla
    name_en: Huauzontle in Pasilla Sauce
    extra_ingredients:
      - queso
      - chile_pasilla
    technique: 
    description_es: >
      planta comestible, parecida al brócoli bañados en una salsa de chile pasilla con jitomate, ajo y especias. En algunas versiones se rellenan con queso y se capeán antes de servirse.
    description_en: >
      planta comestible, parecida al brócoli bañados en una salsa de chile pasilla con jitomate, ajo y especias. En algunas versiones se rellenan con queso y se capeán antes de servirse.
