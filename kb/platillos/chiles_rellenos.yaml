canonical_name: chiles_rellenos
common_names:
  - chiles rellenos
  - chile relleno
  - chiles en nogada
  - chile en nogada
category: platillo_principal
base_ingredients:
  - chile_poblano
  - huevo
  - harina_de_trigo
  - aceite
  - sal
variants:
  en_nogada:
    name_es: Chiles en Nogada
    name_en: Chiles in Walnut Cream Sauce
    extra_ingredients:
      - carne_molida
      - nuez
      - crema
      - granada
      - durazno
      - pera
      - pasitas
      - almendra
      - canela
      - perejil
    technique: chile asado y pelado, relleno de picadillo dulce-salado, capeado, salsa fría de nuez
    description_es: >
      Chile poblano relleno de picadillo de carne con frutas y especias,
      capeado en huevo y bañado con salsa cremosa de nuez (nogada);
      decorado con granada y perejil. Platillo festivo de temporada.
    description_en: >
      Poblano chile stuffed with a sweet-savory meat and fruit picadillo,
      egg-battered, and topped with a cold walnut cream sauce, pomegranate
      seeds, and parsley. A festive seasonal dish.
  relleno_de_queso:
    name_es: Chile Relleno de Queso
    name_en: Cheese-Stuffed Poblano Chile
    extra_ingredients:
      - queso_fresco
      - salsa_de_jitomate
    technique: chile asado y pelado, relleno de queso, capeado en huevo
    description_es: >
      Chile poblano relleno de queso fresco, capeado en huevo y frito;
      bañado en salsa de jitomate.
    description_en: >
      Roasted poblano chile stuffed with fresh cheese, egg-battered and fried,
      served in tomato sauce.
  relleno_de_picadillo:
    name_es: Chile Relleno de Picadillo
    name_en: Meat-Stuffed Poblano Chile
    extra_ingredients:
      - carne_molida
      - jitomate
      - zanahoria
      - papa
      - salsa_de_jitomate
    technique: chile asado y pelado, relleno de picadillo, capeado en huevo
    description_es: >
      Chile poblano relleno de picadillo de carne con verduras, capeado
      en huevo y frito; bañado en salsa de jitomate.
    description_en: >
      Roasted poblano chile stuffed with seasoned ground meat and vegetables,
      egg-battered and fried, served in tomato sauce.
