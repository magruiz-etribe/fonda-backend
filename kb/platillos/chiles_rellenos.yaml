canonical_name: chiles_rellenos
common_names:
  - chiles en nogada
  - chiles rellenos
category: platillo_principal
base_ingredients:
  - chile_poblano
  - jitomate
  - tomatillo
  - cebolla
  - ajo
  - aceite
  - sal
variants:
  en_nogada:
    name_es: Chiles en Nogada
    name_en: Chiles in Walnut Cream Sauce
    extra_ingredients:
      - carne_molida
      - nuez
      - crema
      - granada
      - durazno
      - pera
      - pasitas
      - almendra
      - canela
      - perejil
    technique: chile asado y pelado, relleno de picadillo dulce-salado, capeado, salsa fría de nuez
    description_es: >
      chiles poblanos rellenos de un guisado de carne, frutas y especias, cubiertos con una salsa cremosa de nuez llamada nogada.
    description_en: >
      Poblano chile stuffed with a sweet-savory meat and fruit picadillo, egg-battered, and topped with a cold walnut cream sauce, pomegranate seeds, and parsley. A festive seasonal dish.
  relleno_de_queso:
    name_es: Chile Relleno de Queso
    name_en: Cheese-Stuffed Poblano Chile
    extra_ingredients:
      - queso_fresco
      - salsa_de_jitomate
    technique: chile asado y pelado, relleno de queso, capeado en huevo
    description_es: >
      Chile poblano con queso capeado en huevo.
    description_en: >
      Roasted poblano chile stuffed with fresh cheese, egg-battered and fried, served in tomato sauce.
  relleno_de_picadillo:
    name_es: Chile Relleno de Picadillo
    name_en: Meat-Stuffed Poblano Chile
    extra_ingredients:
      - carne_molida
      - jitomate
      - zanahoria
      - papa
      - salsa_de_jitomate
    technique: chile asado y pelado, relleno de picadillo, capeado en huevo
    description_es: >
      Chile poblano con carne o picadillo capeado en huevo.
    description_en: >
      Roasted poblano chile stuffed with seasoned ground meat and vegetables, egg-battered and fried, served in tomato sauce.
