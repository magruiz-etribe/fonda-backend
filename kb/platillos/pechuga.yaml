canonical_name: pechuga
common_names:
  - pechuga de pollo
  - pechuga asada
  - pechuga empanizada
  - milanesa de pollo
  - pechuga rellena
  - pollo a la mexicana
  - pechuga en salsa verde
  - pechuga en salsa roja
  - pechuga a la plancha
  - pechuga empanizada rellena de jamón y queso
category: platillo_principal
base_ingredients:
  - pechuga_de_pollo
  - sal
  - pimienta
  - ajo
  - limon
  - aceite
variants:
  asada:
    name_es: Pechuga asada
    name_en: Grilled Chicken Breast
    extra_ingredients:
      - ensalada_de_lechuga
      - arroz
      - frijoles
    technique: pechuga marinada sencillamente y cocida a la plancha o comal
    description_es: >
      Pechuga de pollo a la plancha con sal, pimienta, ajo o limón.
    description_en: >
      Chicken breast grilled on a comal with salt, pepper, garlic, or lime — served with rice and beans.
  milanesa:
    name_es: Milanesa de pollo
    name_en: Chicken Milanesa
    extra_ingredients:
      - huevo
      - pan_molido
      - harina_de_trigo
      - papa
    technique: pechuga aplanada, empanizada en harina, huevo y pan molido, y frita
    description_es: >
      Pechuga aplanada, empanizada y frita; común en tortas o plato del día.
    description_en: >
      Thin pounded breaded and fried chicken cutlet — crisp, golden, and popular in tortas or combo plates.
  empanizada_rellena:
    name_es: Pechuga empanizada rellena de jamón y queso
    name_en: Stuffed Breaded Chicken Breast
    extra_ingredients:
      - jamon
      - queso
      - huevo
      - pan_molido
    technique: pechuga rellena de jamón y queso, empanizada y frita
    description_es: >
      Pechuga empanizada rellena de jamón y queso derretido.
    description_en: >
      Breaded chicken breast stuffed with ham and melted cheese — a fonda lunch favorite.
  en_salsa_verde:
    name_es: Pechuga en salsa verde
    name_en: Chicken in Green Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - papa
      - nopales
      - arroz
    technique: pechuga cocida y bañada en salsa verde de tomatillo
    description_es: >
      Pechuga cocida en salsa de tomatillo con chile, ajo y cebolla.
    description_en: >
      Chicken breast simmered in tangy green tomatillo and serrano sauce.
  en_salsa_roja:
    name_es: Pechuga en salsa roja
    name_en: Chicken in Red Sauce
    extra_ingredients:
      - jitomate
      - chile_guajillo
      - papa
      - nopales
      - arroz
    technique: pechuga cocida en salsa roja de jitomate y chile
    description_es: >
      Pechuga cocida en salsa de jitomate con chile, ajo y cebolla.
    description_en: >
      Chicken breast cooked in classic red tomato and dried chile sauce.
  rellena:
    name_es: Pechuga rellena
    name_en: Stuffed Chicken Breast
    extra_ingredients:
      - jamon
      - queso
      - espinaca
      - arroz
      - frijoles
    technique: pechuga abierta, rellena y cocinada al horno o en sartén
    description_es: >
      Pechuga rellena de jamón, queso o verduras, cocida empanizada o en salsa.
    description_en: >
      Butterflied chicken breast stuffed with ham, cheese, or vegetables — baked or pan-cooked.
  a_la_mexicana:
    name_es: Pechuga a la mexicana
    name_en: Mexican-style Chicken Breast
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_verde
    technique: trozos de pechuga salteados con jitomate, cebolla y chile
    description_es: >
      Trozos de pechuga salteados con jitomate, cebolla y chile verde.
    description_en: >
      Diced chicken breast sautéed with tomato, onion, and green chile.
