canonical_name: pechuga
common_names:
  - pechuga
  - pechuga de pollo
  - pechuga asada
  - pechuga empanizada
  - milanesa de pollo
  - milanesa
  - pollo a la mexicana
  - pechuga rellena
  - pollo deshebrado
  - pollo en chipotle
  - Pollo en chipotle
  - Torta de milanesa
  - Milanesa de pollo
  - Milanesa de res
  - Tacos de pollo deshebrado
  - Oreja de elefante (milanesa gigante)
