  oreja_de_elefante_milanesa_gigante:
    name_es: Oreja de elefante (milanesa gigante)
    name_en: Elephant Ear Schnitzel (Mexican-style giant cutlet)
    extra_ingredients:
      - carne_de_res_o_pollo
      - huevo
      - pan_molido
      - aceite
    technique: 
    description_es: >
      Milanesa de res o pollo de gran tamaño, muy delgada y crujiente, llamada “oreja de elefante” por su forma y extensión en el plato. Muy común en fondas y mercados.
    description_en: >
      Milanesa de res o pollo de gran tamaño, muy delgada y crujiente, llamada “oreja de elefante” por su forma y extensión en el plato. Muy común en fondas y mercados.
  empanizada_rellena_de_jamon_y_queso:
