canonical_name: pechuga
common_names:
  - pechuga
  - pechuga de pollo
  - pechuga asada
  - pechuga empanizada
  - milanesa de pollo
  - milanesa
  - pollo a la mexicana
  - pechuga rellena
  - pollo deshebrado
  - pollo en chipotle
category: platillo_principal
base_ingredients:
  - pechuga_de_pollo
  - sal
  - pimienta
  - ajo
  - limon
  - aceite
variants:
  asada:
    name_es: Pechuga Asada
    name_en: Grilled chicken breast
    extra_ingredients:
      - ensalada_de_lechuga
      - arroz
      - frijoles
    technique: marinado sencillo, cocción a la plancha o comal
    description_es: >
      pechuga de pollo cocinada a la plancha o al comal con un sazonado sencillo de sal, pimienta, ajo o limón. Se caracteriza por ser ligera, jugosa y con un sabor natural del pollo, ideal para acompañarse con arroz, frijoles y ensalada.
    description_en: >
      Chicken breast grilled with simple seasoning of salt, pepper, garlic, and lime — light and juicy, served with rice, beans, and salad.
  empanizada:
    name_es: Pechuga Empanizada
    name_en: Breaded chicken breast
    extra_ingredients:
      - huevo
      - pan_molido
      - harina_de_trigo
      - arroz
      - frijoles
    technique: empanizado en harina, huevo y pan molido; frito en aceite
    description_es: >
      La pechuga se cubre con harina, huevo y pan molido, y luego se fríe hasta quedar dorada y crujiente. Tiene una textura crocante por fuera y suave por dentro, y suele servirse con guarniciones como papas, arroz o ensalada.
    description_en: >
      Chicken breast coated in flour, egg, and breadcrumbs, fried until golden and crispy outside, tender inside.
  milanesa:
    name_es: Milanesa de Pollo
    name_en: Chicken milanesa
    extra_ingredients:
      - huevo
      - pan_molido
      - harina_de_trigo
      - arroz
      - frijoles
    technique: pechuga aplanada, empanizada y frita
    description_es: >
      Similar a la empanizada, pero la pechuga se aplana más para lograr una pieza delgada. Se fríe hasta quedar dorada y es muy popular por su textura ligera y crujiente, además de ser común en tortas o platos combinados.
    description_en: >
      Thinly pounded, breaded, and fried chicken breast — lighter and crispier than standard breaded chicken, popular in sandwiches.
  en_salsa_verde:
    name_es: Pechuga en Salsa Verde
    name_en: Chicken in green sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - papa
      - nopales
      - arroz
    technique: cocción de la pechuga bañada en salsa verde de tomatillo
    description_es: >
      La pechuga se cocina y se baña en una salsa de tomatillo (verde) con chile, ajo y cebolla.
    description_en: >
      Chicken breast cooked in a tomatillo and serrano chile green sauce — fresh and mildly tangy.
  en_salsa_roja:
    name_es: Pechuga en Salsa Roja
    name_en: Chicken in red sauce
    extra_ingredients:
      - jitomate
      - chile_guajillo
      - papa
      - nopales
      - arroz
    technique: cocción de la pechuga en salsa roja de jitomate y chile
    description_es: >
      La pechuga se cocina y se baña en una salsa de jitomate (roja) con chile, ajo y cebolla.
    description_en: >
      Chicken breast cooked in a red tomato and chile sauce with garlic and onion — a classic fonda flavor.
  rellena:
    name_es: Pechuga Rellena
    name_en: Stuffed chicken breast
    extra_ingredients:
      - jamon
      - queso
      - espinaca
      - arroz
      - frijoles
    technique: pechuga abierta y rellena, cocinada al horno o en sartén
    description_es: >
      La pechuga se abre y se rellena con ingredientes como jamón y queso, verduras o espinacas, luego se cocina empanizada o en salsa. Es un platillo de textura suave y cremosa en su interior, con contraste de sabores.
    description_en: >
      Chicken breast butterflied and stuffed with ham and cheese (or vegetables), then baked or pan-cooked — tender with a rich filling.
  a_la_mexicana:
    name_es: Pechuga A La Mexicana
    name_en: Mexican-style chicken
    extra_ingredients:
      - jitomate
      - cebolla
      - chile_verde
    technique: trozos de pechuga salteados con jitomate, cebolla y chile
    description_es: >
      Se prepara con trozos de pechuga salteados con jitomate, cebolla y chile verde. Es una preparación sencilla de sabor fresco, ligeramente picante y muy tradicional, que recuerda a los colores de la bandera mexicana.
    description_en: >
      Chicken breast pieces sautéed with tomato, onion, and green chile.
  en_chipotle:
    name_es: Pollo En Chipotle
    name_en: Chicken in Chipotle Sauce
    extra_ingredients:
      - pollo_pierna_muslo_o_pechuga
      - chile_chipotle
      - jitomate
      - cebolla
      - ajo
      - crema_o_leche
      - aceite
      - sal_y_pimienta
    technique: pollo cocinado en salsa cremosa de chipotle
    description_es: >
      Pollo cocinado en salsa cremosa de chipotle.
    description_en: >
      Chicken cooked in a creamy chipotle sauce.
