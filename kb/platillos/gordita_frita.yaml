canonical_name: gordita_frita
common_names:
  - gordita
  - gorditas de chicharrón
  - gorditas de frijol
  - gorditas de queso
  - gorditas de papa
  - gorditas de pollo
  - gorditas de requesón
  - gorditas de migajas
  - gorditas de frijol con queso
category: antojito
base_ingredients:
  - masa_de_maiz
variants:
  gordita_frita:
    name_es: Gordita frita
    name_en: Fried Stuffed Corn Cake
    extra_ingredients:
      - chicharrón
      - frijoles
      - queso
      - papa
      - pollo
      - requesón
      - migajas_de_chicharron
      - salsa
      - cilantro
      - cebolla
    technique: masa gruesa rellena, frita hasta inflarse y quedar crujiente por fuera
    description_es: >
      Masa gruesa de maíz rellena de guisos como chicharrón, frijoles, queso, papa o pollo,
      cocinada en aceite hasta quedar inflada y crujiente por fuera, acompañada con salsa al gusto.
    description_en: >
      Thick corn masa pocket stuffed with chicharrón, beans, cheese, potato, or shredded chicken,
      deep-fried until puffed and crisp outside — served with salsa, cilantro, and onion.
