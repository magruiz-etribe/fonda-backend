canonical_name: caldo
common_names:
  - caldo
  - caldo de pollo
  - caldo de res
  - caldo de habas
  - caldo tlalpeño
  - sopa de pollo
  - sopa de res
category: caldo
base_ingredients:
  - agua
  - carne
  - cebolla
  - ajo
  - sal
variants:
  habas:
    name_es: Caldo de Habas
    name_en: Fava Bean Soup
    extra_ingredients:
      - haba_seca
      - jitomate
      - epazote
    technique: cocción lenta de habas con jitomate y hierbas de olor
    description_es: >
      Sopa tradicional de habas secas cocidas lentamente con ajo, cebolla,
      jitomate y epazote; sabor terroso y reconfortante.
    description_en: >
      Traditional fava bean soup slow-cooked with garlic, onion, tomato,
      and epazote herb — earthy and comforting.
  pollo:
    name_es: Caldo de Pollo
    name_en: Chicken Soup
    extra_ingredients:
      - pollo
      - zanahoria
      - calabaza
      - papa
      - arroz
      - cilantro
    technique: cocción lenta de pollo con verduras en agua o caldo
    description_es: >
      Caldo reconfortante de pollo con zanahoria, calabaza, papa y arroz;
      clásico de fonda para entrar en calor.
    description_en: >
      Comforting chicken soup with carrot, zucchini, potato, and rice —
      a fonda classic for warming up.
  res:
    name_es: Caldo de Res
    name_en: Beef Soup
    extra_ingredients:
      - carne_de_res
      - zanahoria
      - papa
      - chayote
      - elote
      - cilantro
    technique: cocción lenta de hueso y carne de res con verduras
    description_es: >
      Caldo sustancioso de carne de res con zanahoria, papa, chayote y elote
      cocidos lentamente; sabor profundo y nutritivo.
    description_en: >
      Hearty beef soup with carrot, potato, chayote, and corn, slow-cooked
      until the broth is rich and flavorful.
  tlalpeno:
    name_es: Caldo Tlalpeño
    name_en: Tlalpeño Soup
    extra_ingredients:
      - pollo
      - garbanzo
      - chile_chipotle
      - zanahoria
      - ejotes
      - aguacate
      - queso
    technique: caldo de pollo con garbanzo y chipotle, ahumado
    description_es: >
      Caldo de pollo con garbanzos, zanahoria, ejotes, queso, aguacate
      y chile chipotle que le da un toque ahumado y picante.
    description_en: >
      Chicken broth with chickpeas, carrot, green beans, avocado, and smoky
      chipotle chile — a richly flavored Mexico City classic.
