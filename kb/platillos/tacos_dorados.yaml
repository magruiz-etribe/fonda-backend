canonical_name: tacos_dorados
common_names:
  - tacos dorados
  - taquitos
  - flautas
  - flautas de pollo
  - tacos dorados de papa
  - tacos dorados de pollo
  - tacos dorados de res
category: antojito
base_ingredients:
  - tortilla_de_maiz
  - aceite
  - sal
variants:
  papa:
    name_es: Tacos Dorados de Papa
    name_en: Crispy Potato Tacos
    extra_ingredients:
      - papa
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla rellena de puré de papa sazonado, frita hasta dorar
    description_es: >
      Tortillas de maíz rellenas de puré de papa sazonado y fritas hasta quedar crujientes.
    description_en: >
      Corn tortillas stuffed with seasoned mashed potato, fried until crispy — topped with shredded lettuce, cream, fresh cheese, and salsa.
  pollo:
    name_es: Tacos Dorados de Pollo
    name_en: Crispy Chicken Tacos
    extra_ingredients:
      - pollo_deshebrado
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla rellena de pollo deshebrado sazonado, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de pollo deshebrado sazonado.
    description_en: >
      Fried corn tortillas stuffed with seasoned shredded chicken, served with lettuce, sour cream, fresh cheese, and salsa.
  res:
    name_es: Tacos Dorados de Res
    name_en: Crispy Beef Tacos
    extra_ingredients:
      - carne_de_res
      - lechuga
      - crema
      - queso_fresco
      - salsa
    technique: tortilla rellena de carne de res deshebrada, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de carne de res deshebrada o molida con especias.
    description_en: >
      Fried tacos stuffed with seasoned shredded or ground beef — crispy and flavorful.
  barbacoa:
    name_es: Tacos Dorados de Barbacoa
    name_en: Crispy Barbacoa Tacos
    extra_ingredients:
      - barbacoa
      - lechuga
      - crema
      - queso_fresco
      - cilantro
      - limon
    technique: tortilla rellena de barbacoa cocida lentamente, frita hasta dorar
    description_es: >
      Tortillas crujientes rellenas de carne de barbacoa cocida lentamente y condimentada.
    description_en: >
      Crispy tortillas stuffed with slow-cooked, richly flavored barbacoa beef — deeply savory and juicy.
  frijol:
    name_es: Tacos Dorados de Frijol
    name_en: Crispy Bean Tacos
    extra_ingredients:
      - frijoles_refritos
      - lechuga
      - crema
      - queso_fresco
      - salsa
    technique: tortilla rellena de frijoles refritos, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de frijoles refritos o machacados.
    description_en: >
      Fried tortillas stuffed with refried beans — a vegetarian crispy taco option served with lettuce, sour cream, and cheese.
  requeson:
    name_es: Tacos Dorados de Requesón
    name_en: Crispy Ricotta-Style Cheese Tacos
    extra_ingredients:
      - requeson
      - epazote
      - salsa
      - crema
    technique: tortilla rellena de requesón con epazote, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de requesón con epazote.
    description_en: >
      Crispy tacos stuffed with soft, lightly salted requesón (Mexican ricotta-style cheese) and epazote herb.
  flautas:
    name_es: Flautas
    name_en: flautas
    extra_ingredients:
      - pollo_deshebrado
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla enrollada y frita, generalmente más delgada y larga
    description_es: >
      Tortillas enrolladas y fritas, generalmente más largas y delgadas que los tacos dorados tradicionales.
    description_en: >
      Long, thin rolled and fried tortillas — similar to crispy tacos but thinner; usually filled with shredded chicken.
  chicharron_prensado:
    name_es: Tacos Dorados de Chicharrón Prensado
    name_en: Crispy Pressed Pork Crackling Tacos
    extra_ingredients:
      - chicharron_prensado
      - cebolla
      - cilantro
      - queso
      - salsa
    technique: tortilla rellena de chicharrón prensado en salsa, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de chicharrón prensado cocinado en salsa roja o verde.
    description_en: >
      Fried tacos stuffed with pressed pork cracklings braised in red or green salsa — rich and deeply savory.
  camaron:
    name_es: Tacos Dorados De Camarón
    name_en: Crispy Shrimp Tacos
    extra_ingredients:
      - camaron
      - col_rallada
      - mayonesa
      - salsa_picante
      - limon
    technique: tortilla rellena de camarón sazonado, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de camarón sazonado, comunes en regiones costeras.
    description_en: >
      Fried tortillas stuffed with seasoned shrimp, common in coastal regions.
