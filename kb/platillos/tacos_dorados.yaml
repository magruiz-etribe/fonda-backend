canonical_name: tacos_dorados
common_names:
  - tacos dorados
  - taquitos
  - flautas
  - flautas de pollo
  - tacos dorados de papa
  - tacos dorados de pollo
  - tacos dorados de res
  - tacos dorados de frijol
  - tacos dorados de barbacoa
  - tacos dorados de chicharrón
  - tacos dorados de camarón
category: antojito
base_ingredients:
  - tortilla_de_maiz
  - aceite
  - sal
variants:
  papa:
    name_es: Tacos dorados de papa
    name_en: Crispy Potato Tacos
    extra_ingredients:
      - papa
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla rellena de puré de papa sazonado, frita hasta dorar
    description_es: >
      Tortillas rellenas de papa sazonada y fritas hasta quedar crujientes.
    description_en: >
      Corn tortillas stuffed with seasoned mashed potato and fried crisp — topped with lettuce, cream, cheese, and salsa.
  pollo:
    name_es: Tacos dorados de pollo
    name_en: Crispy Chicken Tacos
    extra_ingredients:
      - pollo_deshebrado
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla rellena de pollo deshebrado sazonado, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de pollo deshebrado con lechuga, crema y queso.
    description_en: >
      Fried tortillas stuffed with seasoned shredded chicken — served with lettuce, sour cream, and fresh cheese.
  res:
    name_es: Tacos dorados de res
    name_en: Crispy Beef Tacos
    extra_ingredients:
      - carne_de_res
      - lechuga
      - crema
      - queso_fresco
      - salsa
    technique: tortilla rellena de carne de res deshebrada, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de carne de res deshebrada o molida.
    description_en: >
      Fried tacos stuffed with seasoned shredded or ground beef — crispy and savory.
  barbacoa:
    name_es: Tacos dorados de barbacoa
    name_en: Crispy Barbacoa Tacos
    extra_ingredients:
      - barbacoa
      - lechuga
      - crema
      - queso_fresco
      - cilantro
      - limon
    technique: tortilla rellena de barbacoa, frita hasta dorar
    description_es: >
      Tortillas crujientes rellenas de barbacoa cocida lentamente.
    description_en: >
      Crispy tortillas stuffed with slow-cooked barbacoa — deeply savory and juicy.
  frijol:
    name_es: Tacos dorados de frijol
    name_en: Crispy Bean Tacos
    extra_ingredients:
      - frijoles_refritos
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - queso
    technique: tortilla rellena de frijoles refritos, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de frijoles refritos; a veces con queso.
    description_en: >
      Fried tortillas stuffed with refried beans — a vegetarian option topped with lettuce, cream, and cheese.
  requeson:
    name_es: Tacos dorados de requesón
    name_en: Crispy Ricotta-style Cheese Tacos
    extra_ingredients:
      - requeson
      - epazote
      - salsa
      - crema
    technique: tortilla rellena de requesón con epazote, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de requesón con epazote.
    description_en: >
      Crispy tacos stuffed with soft requesón cheese and epazote herb.
  flautas:
    name_es: Flautas de pollo
    name_en: Chicken Flautas
    extra_ingredients:
      - pollo_deshebrado
      - lechuga
      - crema
      - queso_fresco
      - salsa
      - aguacate
    technique: tortilla enrollada con relleno, frita hasta dorar; más delgada y larga que el taco dorado
    description_es: >
      Tortillas enrolladas y fritas, generalmente de pollo, más largas y delgadas.
    description_en: >
      Long thin rolled fried tortillas — usually chicken-filled, crispier and narrower than standard tacos dorados.
  chicharron_prensado:
    name_es: Tacos dorados de chicharrón prensado
    name_en: Crispy Pressed Pork Crackling Tacos
    extra_ingredients:
      - chicharron_prensado
      - cebolla
      - cilantro
      - queso
      - salsa
    technique: tortilla rellena de chicharrón prensado en salsa, frita hasta dorar
    description_es: >
      Tacos fritos rellenos de chicharrón prensado guisado en salsa.
    description_en: >
      Fried tacos stuffed with pressed pork cracklings braised in red or green salsa.
  camaron:
    name_es: Tacos dorados de camarón
    name_en: Crispy Shrimp Tacos
    extra_ingredients:
      - camaron
      - col_rallada
      - mayonesa
      - salsa_picante
      - limon
    technique: tortilla rellena de camarón sazonado, frita hasta dorar
    description_es: >
      Tortillas fritas rellenas de camarón sazonado.
    description_en: >
      Fried tortillas stuffed with seasoned shrimp — common in coastal fondas.
