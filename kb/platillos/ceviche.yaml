      - limon
      - tomate
      - cebolla
      - cilantro
    technique: 
    description_es: >
      Pescado marinado en jugo de limón mezclado con verduras frescas.
    description_en: >
      Pescado marinado en jugo de limón mezclado con verduras frescas.
  de_camaron:
    name_es: Ceviche de camarón
    name_en: Shrimp Ceviche
