canonical_name: ceviche
common_names:
  - ceviche
  - ceviche de pescado
  - ceviche de camaron
category: platillo_principal
base_ingredients:
  - pescado_blanco
  - limon
  - jitomate
  - cebolla
  - sal
variants:
  ceviche:
    name_es: Ceviche
    name_en: Mexican Ceviche
    extra_ingredients:
      - camaron
      - cilantro
      - chile_serrano
      - aguacate
      - pepino
    technique: marinado en jugo de limón (cocción química), sin fuego
    description_es: >
      Pescado o camarón marinado en jugo de limón mezclado con jitomate,
      cebolla, cilantro y chile; puede servirse con aguacate, tostadas
      o galletas saladas.
    description_en: >
      Fish or shrimp "cooked" in lime juice, mixed with tomato, onion,
      cilantro, and chile — served with avocado, tostadas, or crackers.
