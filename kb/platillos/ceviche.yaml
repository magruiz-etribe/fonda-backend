canonical_name: ceviche
common_names:
  - Tostadas de ceviche de pescado
  - Tostadas de ceviche de camarón
  - Tostadas de ceviche de surimi
category: platillo_principal
base_ingredients:
  - pescado_blanco
  - limon
  - jitomate
  - cebolla
  - sal
variants:
  ceviche:
    name_es: Ceviche
    name_en: Ceviche
    extra_ingredients:
      - camaron
      - cilantro
      - chile_serrano
      - aguacate
      - pepino
    technique: marinado en jugo de limón (cocción química), sin fuego
    description_es: >
      Con pescado o mariscos crudos marinados en jugo de limón o lima, mezclados con jitomate, cebolla, cilantro y chile, puede servirse con aguacate, pepino, tostadas, galletas saladas o salsa picante.
    description_en: >
      Ceviche. Marinado in jugo of limón (cocción química), sin fuego.
  de_pescado:
    name_es: Ceviche de pescado
    name_en: Fish Ceviche
    extra_ingredients:
      - pescado_blanco
      - limon
      - tomate
      - cebolla
      - cilantro
    technique: 
    description_es: >
      Pescado marinado en jugo de limón mezclado con verduras frescas.
    description_en: >
      Pescado marinated in juice of lime mixed with vegetables fresh.
  de_camaron:
    name_es: Ceviche de camarón
    name_en: Shrimp Ceviche
    extra_ingredients:
      - camaron
      - limon
      - tomate
      - cebolla
    technique: 
    description_es: >
      Camarón marinado en cítricos y mezclado con vegetales.
    description_en: >
      Camarón marinated in cítricos and mixed with vegetables.
