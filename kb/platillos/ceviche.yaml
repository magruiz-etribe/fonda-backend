canonical_name: ceviche
common_names:
  - ceviche
  - ceviche de pescado
  - ceviche de camaron
category: platillo_principal
base_ingredients:
  - pescado_blanco
  - limon
  - jitomate
  - cebolla
  - sal
variants:
  ceviche:
    name_es: Ceviche
    name_en: Ceviche
    extra_ingredients:
      - camaron
      - cilantro
      - chile_serrano
      - aguacate
      - pepino
    technique: marinado en jugo de limón (cocción química), sin fuego
    description_es: >
      con pescado o mariscos crudos marinados en jugo de limón o lima, mezclados con jitomate, cebolla, cilantro y chile, puede servirse con aguacate, pepino, tostadas, galletas saladas o salsa picante.
    description_en: >
      Fish or shrimp "cooked" in lime juice, mixed with tomato, onion, cilantro, and chile — served with avocado, tostadas, or crackers.
