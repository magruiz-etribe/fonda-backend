variants:
  poblano:
    name_es: Mole Poblano
    name_en: Mole Poblano
    extra_ingredients:
      - chile_chipotle
      - almendra
      - cacahuate
      - ajonjoli
      - pasitas
      - canela
      - clavo
      - comino
      - pan
      - tortilla
    technique: molienda larga con especias tostadas y frutos secos
    description_es: >
      Salsa de chiles secos, especias, frutos secos, chocolate y pan.
    description_en: >
      Rich, complex sauce from Puebla — dried chiles, warm spices, nuts, chocolate, and bread give it a deep, slightly sweet flavor.
  negro:
    name_es: Mole negro
    name_en: Oaxacan Black Mole
    extra_ingredients:
      - chile_chilhuacle_negro
      - chile_mulato_oscuro
      - chocolate_oaxaqueño
      - tortilla_quemada
      - pasitas
      - almendra
      - ajonjoli
      - clavo
      - canela
      - chile_chilhuacle
      - chocolate
      - especias
    technique: tostado de chiles hasta quemar, chocolate oaxaqueño
    description_es: >
      Mole complejo de Oaxaca elaborado con varios chiles y chocolate.
    description_en: >
      Mole complejo de Oaxaca elaborado con varios chiles y chocolate.
  verde:
    name_es: Mole Verde
    name_en: Green Mole
    extra_ingredients:
      - tomatillo
      - pepita_de_calabaza
      - cilantro
      - epazote
      - chile_serrano
    technique: molido en crudo con tomatillo y hierbas frescas
    description_es: >
      Salsa de tomatillo, pepita de calabaza, cilantro y epazote.
    description_en: >
      Fresh mole made with tomatillo, pumpkin seeds, and herbs — lighter and more herbal than dark moles.
  rojo:
    name_es: Mole Rojo
    name_en: Red Mole
    extra_ingredients:
      - chile_guajillo
      - ajonjoli
      - cacahuate
      - canela
      - clavo
    technique: salteado de chiles secos con especias
    description_es: >
      Mole rojo de fonda, más sencillo que el poblano; chiles guajillo/ancho con un toque de cacahuate y especias.
    description_en: >
      Everyday red mole — simpler than Poblano-style, with guajillo and ancho chiles, peanuts, and spices.
  poblano_con_pollo:
    name_es: Mole poblano con pollo
    name_en: Chicken with Poblano Mole Sauce
    extra_ingredients:
      - pollo
      - chile_ancho
      - chile_mulato
      - chocolate
      - ajonjoli
      - especias
      - tortilla_o_pan
    technique: 
    description_es: >
      Pollo servido con una salsa espesa y compleja elaborada con chiles, especias, chocolate y otros ingredientes.
    description_en: >
      Pollo servido con una salsa espesa y compleja elaborada con chiles, especias, chocolate y otros ingredientes.
