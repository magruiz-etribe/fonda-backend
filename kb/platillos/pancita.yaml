canonical_name: pancita
common_names:
category: caldo
base_ingredients:
  - panza_de_res
  - agua
  - ajo
  - cebolla
  - sal
  - chile_guajillo
  - chile_ancho
  - chile_pasilla
  - or_gano
variants:
  pancita:
    name_es: Pancita
    name_en: Tripe Soup
    extra_ingredients:
      - lim_n
      - cebolla_picada
      - or_gano_seco
      - chile_en_polvo
      - tortilla_o_pan
    technique: 
    description_es: >
      Panza de res en caldo con chiles, ajo y cebolla; acompañamiento cebolla, orégano, limón y tortillas.
    description_en: >
      Beef tripe in broth with chiles, garlic, and onion; served with onion, oregano, lime, and tortillas.
  menudo:
    name_es: Menudo
    name_en: Beef Tripe Soup
    extra_ingredients:
      - pancita_de_res
      - chile_guajillo
      - ajo
      - cebolla
      - oregano
    technique: 
    description_es: >
      Caldo preparado con pancita de res y chiles rojos, muy popular para desayunos de fin de semana.
    description_en: >
      Beef Tripe Soup made with pancita de res, guajillo chile, ajo, onion and oregano.
  rojo:
    name_es: Menudo rojo
    name_en: Red Menudo
    extra_ingredients:
      - panza_de_res
      - chile_guajillo
      - maiz
    technique: 
    description_es: >
      Sopa de pancita de res en chile rojo.
    description_en: >
      Red Menudo made with panza de res, guajillo chile and maiz.
  blanco:
    name_es: Menudo blanco
    name_en: White Menudo
    extra_ingredients:
      - pancita_de_res
      - maiz
      - ajo
    technique: 
    description_es: >
      Sopa de pancita sin chile rojo.
    description_en: >
      White Menudo made with pancita de res, maiz and ajo.
  pancita_en_rojo_estilo_fonda:
    name_es: Pancita en rojo estilo fonda
    name_en: Red Tripe Soup
    extra_ingredients:
      - pancita_de_res
      - chile_guajillo
      - maiz
    technique: 
    description_es: >
      Menudo más espeso y casero estilo fonda.
    description_en: >
      Menudo más thick and casero estilo fonda.
