canonical_name: ensaladas
common_names:
category: guarnicion
base_ingredients:
  - at_n
  - mayonesa
  - chile
  - cebolla
variants:
  de_atun:
    name_es: Ensalada De Atún
    name_en: Tuna Salad
    extra_ingredients:
      - verduras
    technique: 
    description_es: >
      Atún mezclado con verduras picadas como jitomate, cebolla, zanahoria, chícharos o papa. Generalmente se combina con mayonesa, limón y especias para darle sabor.
    description_en: >
      Tuna mixed with diced tomato, onion, carrot, peas, or potato, bound with mayonnaise, lime, and spices.
  de_pepino:
    name_es: Ensalada De Pepino
    name_en: Cucumber Salad
    extra_ingredients:
      - chile
      - cebolla
      - jitomate
      - queso
      - crema
      - vinagre
    technique: 
    description_es: >
      Pepino en rodajas o cubos, mezclado con ingredientes como jitomate, cebolla, limón y sal, puede incluir chile, queso, crema, hierbas frescas o vinagre.
    description_en: >
      Sliced or diced cucumber with tomato, onion, lime, and salt; may include chile, cheese, crema, fresh herbs, or vinegar.
