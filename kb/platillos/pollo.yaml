canonical_name: pollo
common_names:
  - pollo en adobo
  - pollo encacahuatado
  - pollo a la jardinera
  - pollo en salsa de chipotle
  - pollo en salsa de guajillo
  - pollo en salsa de pasilla
  - pollo en salsa de tomatillo asado
  - pollo con chipotle y papa
  - pollo rostizado
  - pollo en salsa de chile cascabel
  - pollo en salsa de naranja
  - pollo en salsa de cerveza
category: platillo_principal
base_ingredients:
  - pollo
  - chile_ancho
  - ajo
  - vinagre
variants:
  en_adobo:
    name_es: Pollo en adobo
    name_en: Chicken Adobo
    extra_ingredients:
      - chile_ancho
      - ajo
      - vinagre
    technique: pollo marinado en adobo de chiles secos y cocido en salsa
    description_es: >
      Pollo marinado en adobo de chiles secos.
    description_en: >
      Chicken marinated in dried chile adobo with garlic and vinegar — deep and tangy.
  encacahuatado:
    name_es: Pollo encacahuatado
    name_en: Peanut Sauce Chicken
    extra_ingredients:
      - cacahuate
      - chile_ancho
    technique: pollo guisado en salsa de cacahuate molido con chile
    description_es: >
      Pollo bañado en salsa preparada con cacahuate molido.
    description_en: >
      Chicken bathed in a rich sauce of ground peanuts and dried chile.
  a_la_jardinera:
    name_es: Pollo a la jardinera
    name_en: Garden-style Chicken
    extra_ingredients:
      - zanahoria
      - chicharos
      - papa
      - calabaza
    technique: pollo guisado con verduras mixtas en caldo ligero
    description_es: >
      Pollo cocinado con zanahoria, chícharos, papa y calabaza.
    description_en: >
      Chicken stewed with mixed vegetables — carrot, peas, potato, and squash.
  en_salsa_de_chipotle:
    name_es: Pollo en salsa de chipotle
    name_en: Chipotle Chicken
    extra_ingredients:
      - chipotle
      - crema
      - papa
    technique: pollo guisado en salsa cremosa de chipotle; a veces con papa
    description_es: >
      Pollo en salsa cremosa de chipotle; común con papa.
    description_en: >
      Chicken in creamy chipotle sauce — smoky, mildly spicy, often with potato.
  en_salsa_de_guajillo:
    name_es: Pollo en salsa de guajillo
    name_en: Chicken in Guajillo Sauce
    extra_ingredients:
      - chile_guajillo
      - ajo
      - jitomate
    technique: pollo cocido en salsa roja de guajillo
    description_es: >
      Pollo en salsa roja de guajillo.
    description_en: >
      Chicken simmered in mild red guajillo chile and tomato sauce.
  en_salsa_de_pasilla:
    name_es: Pollo en salsa de pasilla
    name_en: Chicken in Pasilla Sauce
    extra_ingredients:
      - chile_pasilla
      - jitomate
    technique: pollo guisado en salsa oscura de chile pasilla
    description_es: >
      Pollo en salsa oscura de chile pasilla.
    description_en: >
      Chicken in dark pasilla chile sauce — earthy and moderately spicy.
  en_salsa_de_tomatillo_asado:
    name_es: Pollo en salsa de tomatillo asado
    name_en: Chicken in Roasted Tomatillo Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
    technique: pollo guisado en salsa verde de tomatillo tatemado
    description_es: >
      Pollo en salsa verde de tomatillo asado.
    description_en: >
      Chicken in roasted tomatillo green sauce — tangy and bright.
  rostizado:
    name_es: Pollo rostizado
    name_en: Roast Chicken
    extra_ingredients:
      - ajo
      - especias
    technique: pollo entero sazonado y rostizado al horno o en rotisserie
    description_es: >
      Pollo entero rostizado con especias simples.
    description_en: >
      Whole chicken roasted with simple spices — golden skin and juicy meat.
  en_salsa_de_chile_cascabel:
    name_es: Pollo en salsa de chile cascabel
    name_en: Chicken in Cascabel Sauce
    extra_ingredients:
      - chile_cascabel
      - jitomate
    technique: pollo guisado en salsa de chile cascabel y jitomate
    description_es: >
      Pollo en salsa ligeramente picante de chile cascabel.
    description_en: >
      Chicken in cascabel chile sauce — nutty, mildly spicy, and deep red.
  en_salsa_de_naranja:
    name_es: Pollo en salsa de naranja
    name_en: Chicken in Orange Sauce
    extra_ingredients:
      - naranja
      - especias
    technique: pollo guisado en salsa dulce de jugo de naranja
    description_es: >
      Pollo en salsa dulce de naranja.
    description_en: >
      Chicken in sweet orange sauce — bright citrus notes with warm spices.
  en_salsa_de_cerveza:
    name_es: Pollo en salsa de cerveza
    name_en: Chicken in Beer Sauce
    extra_ingredients:
      - cerveza
      - ajo
      - jitomate
    technique: pollo cocido en salsa de cerveza, jitomate y especias
    description_es: >
      Pollo cocido en salsa de cerveza y especias.
    description_en: >
      Chicken braised in beer, tomato, and spices — savory with a malty depth.
