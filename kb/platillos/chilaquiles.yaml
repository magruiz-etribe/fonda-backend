canonical_name: chilaquiles
common_names:
  - chilaquiles
  - chilaquiles verdes
  - chilaquiles rojos
  - chilaquiles divorciados
  - totopos en salsa
  - chilaquiles con pollo
  - chilaquiles con huevo
  - chilaquiles con crema
category: desayuno
base_description: "Totopos de maíz bañados en salsa [tipo_de_salsa], acompañados con crema, queso, cebolla y alguna proteína opcional"
variables_requeridas:
  - tipo_de_salsa
  - tipo_de_proteina
variable_opciones:
  tipo_de_salsa:
    - verde
    - roja
    - divorciados (salsa verde y roja)
  tipo_de_proteina:
    - pollo
    - huevo
    - bistec
    - cecina
    - salchicha
    - arrachera
ingredientes_base_default:
  - tortilla de maíz
  - aceite
  - crema
  - queso
  - cebolla
