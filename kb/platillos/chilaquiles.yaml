canonical_name: chilaquiles
common_names:
  - chilaquiles
  - chilaquiles verdes
  - chilaquiles rojos
  - chilaquiles divorciados
  - chilaquiles con pollo
  - chilaquiles con huevo
  - chilaquiles con arrachera o bistec
  - chilaquiles con cecina
  - chilaquiles con chorizo
  - chilaquiles de mole
  - torta de chilaquiles
  - Chilaquiles verdes
  - Chilaquiles rojos
  - Torta de chilaquiles
  - Chilaquiles con huevo estrellado
  - Chilaquiles rojos con pollo
  - Chilaquiles verdes con huevo
category: antojito
base_ingredients:
  - totopos_de_maiz
  - salsa
  - aceite
  - sal
variants:
  verdes:
    name_es: Chilaquiles verdes
    name_en: Green Chilaquiles
    extra_ingredients:
      - tortilla
      - salsa_verde
      - crema
      - queso
      - totopos
      - tomate_verde
      - queso_fresco
    technique: 
    description_es: >
      Totopos en salsa verde con crema y queso.
    description_en: >
      Totopos en salsa verde con crema y queso.
  rojos:
    name_es: Chilaquiles rojos
    name_en: Red Chilaquiles
    extra_ingredients:
      - tortilla
      - salsa_roja
      - crema
      - queso
      - totopos
      - chile_guajillo
      - jitomate
    technique: 
    description_es: >
      Totopos en salsa roja picante.
    description_en: >
      Totopos en salsa roja picante.
  divorciados:
    name_es: Chilaquiles Divorciados
    name_en: Divorced Chilaquiles / Half Red & Half Green Chilaquiles
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - chile_guajillo
      - crema
      - queso_fresco
      - frijoles
    technique: mitad en salsa verde, mitad en salsa roja, separadas en el plato
    description_es: >
      Mitad verdes y mitad rojos en el mismo plato.
    description_en: >
      Half the chips in green sauce, half in red sauce — two salsas on the same plate, famously separated.
  con_pollo:
    name_es: Chilaquiles con Pollo
    name_en: Chicken Chilaquiles
    extra_ingredients:
      - pollo_deshebrado
      - salsa_verde_o_roja
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa con pollo deshebrado encima o integrado
    description_es: >
      Llevan pollo deshebrado como proteína principal.
    description_en: >
      Green or red chilaquiles topped or mixed with shredded chicken — complete and satisfying.
  con_huevo:
    name_es: Chilaquiles con Huevo
    name_en: Chilaquiles with Eggs
    extra_ingredients:
      - huevo
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa con huevo estrellado o revuelto encima
    description_es: >
      Se sirven con huevo estrellado o revuelto encima
    description_en: >
      Chilaquiles topped with a fried or scrambled egg — a very popular complete breakfast.
  con_arrachera:
    name_es: Chilaquiles con Arrachera
    name_en: Skirt Steak Chilaquiles / Beef Steak Chilaquiles
    extra_ingredients:
      - carne_de_res
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa con arrachera a la plancha en rebanadas
    description_es: >
      verdes o rojos servidos con carne de res
    description_en: >
      Green or red chilaquiles served with sliced grilled skirt steak — a heartier, more indulgent version.
  con_chorizo:
    name_es: Chilaquiles con Chorizo
    name_en: Chorizo Chilaquiles
    extra_ingredients:
      - chorizo
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa mezclados o acompañados con chorizo frito
    description_es: >
      verdes o rojos mezclados o acompañados con chorizo
    description_en: >
      Green or red chilaquiles with fried Mexican chorizo — spicy and richly flavored.
  de_mole:
    name_es: Chilaquiles de Mole
    name_en: Mole Chilaquiles
    extra_ingredients:
      - mole_negro
      - queso_fresco
      - crema
      - cebolla
      - ajonjoli
    technique: totopos bañados en mole espeso
    description_es: >
      Bañados en mole, especialmente mole negro oaxaqueño
    description_en: >
      Corn chips bathed in thick mole sauce — especially deep and complex when made with Oaxacan black mole.
  torta:
    name_es: Torta de Chilaquiles
    name_en: Chilaquiles Sandwich / Chilaquiles Torta
    extra_ingredients:
      - bolillo
      - crema
      - queso_fresco
      - cebolla
      - frijoles
      - aguacate
    technique: chilaquiles (verdes o rojos) dentro de un bolillo, a veces con proteína
    description_es: >
      chilaquiles dentro de un bolillo, a veces con algún tipo de proteína
    description_en: >
      Chilaquiles stuffed inside a bolillo roll with sour cream, cheese, and beans — an unconventional but beloved snack.
  con_cecina:
    name_es: Chilaquiles Con Cecina
    name_en: Cecina Chilaquiles
    extra_ingredients:
      - cecina
      - crema
      - queso_fresco
      - cebolla
      - frijoles
      - aguacate
    technique: totopos en salsa con cecina
    description_es: >
      verdes o rojos servidos con cecina
    description_en: >
      Green or red chilaquiles served with cecina.
  torta_de_chilaquiles:
    name_es: Torta de chilaquiles
    name_en: Chilaquiles Sandwich
    extra_ingredients:
      - bolillo
      - chilaquiles
      - crema
    technique: 
    description_es: >
      Bolillo relleno con chilaquiles y complementos.
    description_en: >
      Bolillo relleno con chilaquiles y complementos.
  con_huevo_estrellado:
    name_es: Chilaquiles con huevo estrellado
    name_en: Chilaquiles with Fried Egg
    extra_ingredients:
      - tortilla
      - salsa
      - huevo
    technique: 
    description_es: >
      Chilaquiles acompañados con huevo frito.
    description_en: >
      Chilaquiles acompañados con huevo frito.
  rojos_con_pollo:
    name_es: Chilaquiles rojos con pollo
    name_en: Red Chilaquiles with Chicken
    extra_ingredients:
      - tortilla
      - pollo
      - salsa_roja
    technique: 
    description_es: >
      Totopos en salsa roja con pollo deshebrado.
    description_en: >
      Totopos en salsa roja con pollo deshebrado.
  verdes_con_huevo:
    name_es: Chilaquiles verdes con huevo
    name_en: Green Chilaquiles with Egg
    extra_ingredients:
      - tortilla
      - huevo
      - tomatillo
    technique: 
    description_es: >
      Chilaquiles en salsa verde con huevo.
    description_en: >
      Chilaquiles en salsa verde con huevo.
