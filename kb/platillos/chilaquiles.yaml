canonical_name: chilaquiles
common_names:
  - chilaquiles
  - chilaquiles verdes
  - chilaquiles rojos
  - chilaquiles divorciados
  - chilaquiles con pollo
  - chilaquiles con huevo
  - chilaquiles con arrachera
  - chilaquiles con cecina
  - chilaquiles con chorizo
  - chilaquiles de mole
category: antojito
base_ingredients:
  - totopos_de_maiz
  - salsa
  - aceite
  - sal
variants:
  verdes:
    name_es: Chilaquiles verdes
    name_en: Green Chilaquiles
    extra_ingredients:
      - salsa_verde
      - crema
      - queso_fresco
      - cebolla
    technique: totopos bañados en salsa verde de tomatillo hasta ablandar parcialmente
    description_es: >
      Totopos en salsa verde con crema, queso y cebolla.
    description_en: >
      Corn chips bathed in green tomatillo salsa with cream, fresh cheese, and onion.
  rojos:
    name_es: Chilaquiles rojos
    name_en: Red Chilaquiles
    extra_ingredients:
      - salsa_roja
      - crema
      - queso_fresco
      - cebolla
    technique: totopos bañados en salsa roja de jitomate y chile guajillo
    description_es: >
      Totopos en salsa roja con crema, queso y cebolla.
    description_en: >
      Corn chips in red tomato and guajillo salsa — topped with cream, cheese, and onion.
  divorciados:
    name_es: Chilaquiles divorciados
    name_en: Divorced Chilaquiles
    extra_ingredients:
      - salsa_verde
      - salsa_roja
      - crema
      - queso_fresco
      - frijoles
    technique: mitad de totopos en salsa verde y mitad en salsa roja, separados en el plato
    description_es: >
      Mitad verdes y mitad rojos en el mismo plato.
    description_en: >
      Half the chips in green sauce, half in red — famously kept apart on the same plate.
  con_pollo:
    name_es: Chilaquiles con pollo
    name_en: Chicken Chilaquiles
    extra_ingredients:
      - pollo_deshebrado
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa verde o roja con pollo deshebrado encima
    description_es: >
      Chilaquiles verdes o rojos con pollo deshebrado.
    description_en: >
      Green or red chilaquiles topped with shredded chicken — a complete breakfast plate.
  con_huevo:
    name_es: Chilaquiles con huevo
    name_en: Chilaquiles with Eggs
    extra_ingredients:
      - huevo
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa con huevo estrellado o revuelto encima
    description_es: >
      Chilaquiles con huevo estrellado o revuelto encima.
    description_en: >
      Chilaquiles topped with a fried or scrambled egg — very popular at fondas.
  con_arrachera:
    name_es: Chilaquiles con arrachera
    name_en: Skirt Steak Chilaquiles
    extra_ingredients:
      - arrachera
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa con arrachera a la plancha en rebanadas
    description_es: >
      Chilaquiles verdes o rojos con arrachera a la plancha.
    description_en: >
      Green or red chilaquiles with sliced grilled skirt steak — hearty and indulgent.
  con_cecina:
    name_es: Chilaquiles con cecina
    name_en: Cecina Chilaquiles
    extra_ingredients:
      - cecina
      - crema
      - queso_fresco
      - cebolla
      - frijoles
    technique: totopos en salsa acompañados de cecina de res asada
    description_es: >
      Chilaquiles verdes o rojos con cecina.
    description_en: >
      Green or red chilaquiles served with grilled salted beef cecina.
  con_chorizo:
    name_es: Chilaquiles con chorizo
    name_en: Chorizo Chilaquiles
    extra_ingredients:
      - chorizo
      - crema
      - queso_fresco
      - cebolla
    technique: totopos en salsa mezclados o acompañados con chorizo frito
    description_es: >
      Chilaquiles verdes o rojos con chorizo frito.
    description_en: >
      Green or red chilaquiles with fried Mexican chorizo — spicy and rich.
  de_mole:
    name_es: Chilaquiles de mole
    name_en: Mole Chilaquiles
    extra_ingredients:
      - mole_negro
      - queso_fresco
      - crema
      - cebolla
      - ajonjoli
    technique: totopos bañados en mole espeso hasta ablandar parcialmente
    description_es: >
      Totopos bañados en mole, especialmente mole negro.
    description_en: >
      Corn chips bathed in thick mole sauce — especially complex with Oaxacan black mole.
