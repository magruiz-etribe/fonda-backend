canonical_name: tortas_de_huauzontle
common_names:
  - huauzontle
category: platillo_principal
base_ingredients:
  - huauzontle
  - queso_fresco
  - huevo
  - harina_de_trigo
  - aceite
  - chile
variants:
  en_chile_pasilla:
    name_es: Tortas de Huauzontle en Chile Pasilla
    name_en: Huauzontle patties in pasilla chili sauce
    extra_ingredients:
      - chile_pasilla
      - ajo
      - caldo_de_pollo
    technique: capeado en huevo y harina, frito; salsa de chile pasilla hidratado
    description_es: >
      Ramitos de huauzontle cocido, rellenos comúnmente con queso fresco o panela, cubiertos con huevo batido (capeado) y fritos. Servidos con una salsa de chile pasilla, preparada con chiles secos, ajo, cebolla y caldo(res, pollo o agua).
    description_en: >
      Huauzontle patties in pasilla chili sauce. Capeado in huevo and harina, fried; salsa of chile pasilla hidratado.
  en_jitomate:
    name_es: Tortas de Huauzontle en Jitomate
    name_en: Huauzontle patties in tomato sauce
    extra_ingredients:
      - jitomate
      - ajo
      - cebolla
    technique: capeado en huevo y harina, frito; salsa de jitomate cocido
    description_es: >
      Ramitos de huauzontle cocido, rellenos comúnmente con queso fresco o panela, cubiertos con huevo batido (capeado) y fritos. bañados en salsa de jitomate, preparada con tomate rojo, ajo, cebolla y, en ocasiones, un toque ligero de chile.
    description_en: >
      Egg-battered huauzontle and cheese patties fried until golden, served in a tomato sauce with garlic and onion.
