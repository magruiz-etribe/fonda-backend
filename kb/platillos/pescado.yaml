canonical_name: pescado
common_names:
  - pescado a la veracruzana
  - pescado empanizado
  - pescado empapelado
  - pescado a la diabla
  - filete de pescado al mojo de ajo
category: platillo_principal
base_ingredients:
  - pescado_blanco
  - lim_n
  - sal_y_pimienta
variants:
  veracruzana:
    name_es: Pescado a la veracruzana
    name_en: Veracruz-Style Fish
    extra_ingredients:
      - jitomate
      - cebolla
      - ajo
      - chile_guero_o_jalapeno
      - aceitunas_verdes
      - alcaparras
      - laurel
      - aceite_de_oliva
      - pimiento_morrón
    technique: filete cocido en salsa de jitomate con aceitunas y alcaparras
    description_es: >
      Filete cocinado con jitomate, aceitunas y alcaparras.
    description_en: >
      White fish fillet braised in a tomato sauce with green olives, capers, and mild chile.
  empanizado:
    name_es: Pescado empanizado
    name_en: Breaded Fish
    extra_ingredients:
      - huevo
      - pan_molido
    technique: filete empanizado y frito
    description_es: >
      Filete de pescado empanizado y frito.
    description_en: >
      Fish fillet breaded in egg and crumbs, fried until golden and crisp.
  empapelado:
    name_es: Pescado empapelado
    name_en: Foil-Baked Fish
    extra_ingredients:
      - cebolla
      - jitomate
      - limon
    technique: pescado cocido al vapor en papel aluminio con verduras
    description_es: >
      Filete de pescado horneado con verduras y especias.
    description_en: >
      Fish fillet steamed in foil with tomato, onion, and lime — tender and aromatic.
  a_la_diabla:
    name_es: Pescado a la diabla
    name_en: Devil's Style Fish
    extra_ingredients:
      - chile_de_arbol
      - ajo
      - jitomate
    technique: pescado cocido en salsa picante de chile seco
    description_es: >
      Pescado en salsa muy picante de chile seco.
    description_en: >
      Fish simmered in a fiery dried-chile and tomato sauce.
  al_mojo_de_ajo:
    name_es: Filete de pescado al mojo de ajo
    name_en: Fish in Garlic Sauce
    extra_ingredients:
      - ajo
      - mantequilla
      - limon
    technique: filete en salsa de ajo y mantequilla
    description_es: >
      Filete de pescado en salsa de ajo.
    description_en: >
      Fish fillet in a sizzling garlic-and-butter sauce with a squeeze of lime.
