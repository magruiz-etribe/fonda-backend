canonical_name: consome
common_names:
  - consomé
  - consomé de barbacoa
  - consomé de borrego
  - consomé de verduras
category: caldo
base_ingredients:
  - caldo
  - verduras
variants:
  de_barbacoa:
    name_es: Consomé de barbacoa
    name_en: Barbacoa Consommé
    extra_ingredients:
      - carne_de_borrego
      - garbanzo
      - arroz
      - cilantro
      - cebolla
    technique: caldo claro de la cocción lenta de barbacoa, servido con garbanzo y arroz
    description_es: >
      Caldo claro y sustancioso que acompaña la barbacoa de fin de semana.
    description_en: >
      Clear, rich broth from slow-cooked barbacoa — served with chickpeas, rice, and chopped onion.
  de_verduras:
    name_es: Consomé de verduras
    name_en: Vegetable Consommé
    extra_ingredients:
      - zanahoria
      - papa
      - calabaza
      - chayote
      - apio
      - pasta
      - arroz
    technique: verduras cocidas en caldo claro; opcional pasta o arroz
    description_es: >
      Caldo ligero con zanahoria, papa, calabaza, chayote o apio.
    description_en: >
      Light broth with carrot, potato, squash, chayote, or celery — optionally with rice or pasta.
