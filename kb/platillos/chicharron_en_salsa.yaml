canonical_name: chicharron_en_salsa
common_names:
  - chicharron en salsa
  - chicharrón en salsa
  - chicharron en salsa verde
  - chicharrón en salsa verde
  - chicharron en salsa roja
  - chicharrón en salsa roja
category: guisado
base_ingredients:
  - chicharron_de_cerdo
  - jitomate
  - chile_seco
  - cebolla
  - ajo
  - sal
  - aceite
variants:
  roja:
    name_es: Chicharrón en Salsa Roja
    name_en: Pork Rinds in Red Sauce
    extra_ingredients:
      - chile_guajillo
      - cilantro
    technique: rehidratado del chicharrón en salsa de jitomate y chile seco
    description_es: >
      Chicharrón de cerdo rehidratado y cocido en salsa roja de jitomate
      y chile seco; textura suave y sabor profundo.
    description_en: >
      Pork rinds softened and simmered in a red tomato-and-dried-chile sauce —
      tender texture with deep, savory flavor.
  verde:
    name_es: Chicharrón en Salsa Verde
    name_en: Pork Rinds in Green Sauce
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - cilantro
      - chile_de_arbol
    technique: rehidratado del chicharrón en salsa verde de tomatillo
    description_es: >
      Chicharrón de cerdo rehidratado en salsa verde de tomatillo y chile
      serrano; sabor fresco, ligeramente ácido y picante.
    description_en: >
      Pork rinds softened in a tomatillo and serrano chile green sauce —
      fresh, slightly tart, and mildly spicy.
