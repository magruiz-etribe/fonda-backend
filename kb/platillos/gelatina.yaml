canonical_name: gelatina
common_names:
  - gelatina de agua
category: postre
base_ingredients:
  - agua
  - grenetina
  - saborizante
  - leche
variants:
  gelatina:
    name_es: Gelatina
    name_en: Gelatin Dessert
    extra_ingredients:
      - fruta
      - pasas
      - nuez
    technique: 
    description_es: >
      Elaborado a base de grenetina o gelatina disuelta en agua, leche o jugos de fruta. Puede prepararse en distintos sabores y colores, y servirse sola o acompañada con fruta, crema o leche condensada.
    description_en: >
      Gelatin dessert made with water, milk, or fruit juice. Served plain or with fruit, crema, or condensed milk.
  de_mosaico:
    name_es: Gelatina de mosaico
    name_en: Mosaic Gelatin
    extra_ingredients:
      - gelatina
      - leche_condensada
      - grenetina
    technique: 
    description_es: >
      Postre elaborado con cubos de gelatina de colores en base cremosa.
    description_en: >
      Colorful gelatin cubes set in a creamy base.
  de_leche:
    name_es: Gelatina de leche
    name_en: Milk Gelatin
    extra_ingredients:
      - leche
      - azucar
      - grenetina
    technique: 
    description_es: >
      Postre suave preparado con leche y grenetina.
    description_en: >
      Smooth milk gelatin dessert.
  de_cafe:
    name_es: Gelatina de café
    name_en: Coffee Gelatin
    extra_ingredients:
      - cafe
      - azucar
      - grenetina
    technique: 
    description_es: >
      Gelatina aromatizada con café.
    description_en: >
      Coffee-flavored gelatin dessert.
