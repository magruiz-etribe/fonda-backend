canonical_name: churros
common_names:
  - churros
  - churros rellenos
category: postre
base_ingredients:
  - harina_de_trigo
  - agua
  - azucar
  - aceite
  - sal
variants:
  tradicionales:
    name_es: Churros Tradicionales
    name_en: Churros
    extra_ingredients:
      - canela
    technique: masa frita en forma alargada, espolvoreada con azúcar y canela
    description_es: >
      Masa dulce extruida y frita en forma alargada, espolvoreada con azúcar
      y canela; crujientes por fuera y suaves por dentro.
    description_en: >
      Fried dough piped into long ridged sticks, dusted with sugar and
      cinnamon — crispy outside, soft inside.
  rellenos:
    name_es: Churros Rellenos
    name_en: Filled Churros
    extra_ingredients:
      - canela
      - chocolate
      - leche_condensada
      - cajeta
      - mermelada
    technique: masa frita rellena con manga pastelera antes de servir
    description_es: >
      Churros rellenos de chocolate, cajeta, leche condensada o mermelada;
      la misma masa crujiente con un corazón cremoso y dulce.
    description_en: >
      Churros filled with chocolate, caramel (cajeta), condensed milk, or
      jam — the same crispy shell with a rich, sweet creamy center.
