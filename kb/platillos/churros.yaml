canonical_name: churros
common_names:
  - churros
  - churros rellenos
category: postre
base_ingredients:
  - harina_de_trigo
  - agua
  - azucar
  - aceite
  - sal
variants:
  tradicionales:
    name_es: Churros Tradicionales
    name_en: Churros
    extra_ingredients:
      - canela
    technique: masa frita en forma alargada, espolvoreada con azúcar y canela
    description_es: >
      Masa dulce frita en forma alargada, espolvoreada con azúcar y canela
    description_en: >
      Fried dough piped into long ridged sticks, dusted with sugar and cinnamon — crispy outside, soft inside.
  rellenos:
    name_es: Churros Rellenos
    name_en: filled churros
    extra_ingredients:
      - canela
      - chocolate
      - leche_condensada
      - cajeta
      - mermelada
    technique: masa frita rellena con manga pastelera antes de servir
    description_es: >
      Masa dulce frita en forma alargada, espolvoreada con azúcar y canela, rellena de chocolate, leche condensada, mermelada o cajeta.
    description_en: >
      Churros filled with chocolate, caramel (cajeta), condensed milk, or jam — the same crispy shell with a rich, sweet creamy center.
