canonical_name: platanos_fritos_con_crema
common_names:
  - platanos fritos
  - platanos de carrito
category: postre
base_description: "Platano macho rebanado, frito en aceite o manteca, cubierto con aderezos dulces al momento de servir."
variables_requeridas:
  - estilo_coccion
variable_opciones:
  estilo_coccion:
    - fritos_en_aceite (textura crujiente por fuera)
