  toppings_seleccionados:
    - crema_y_lechera
    - mermelada_de_fresa
    - chispas_de_chocolate
ingredientes_base_default:
  - Platano macho maduro
  - Aceite vegetal para freir
  - Crema acida de rancho
  - Leche condensada