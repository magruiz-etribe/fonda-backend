canonical_name: crema
common_names:
  - crema de elote
  - crema de espinacas
  - crema de verduras
  - crema de champiñones
  - crema de poblano
category: caldo
base_ingredients:
  - leche
  - crema
variants:
  de_elote:
    name_es: Crema de elote
    name_en: Corn Cream Soup
    extra_ingredients:
      - elote
      - mantequilla
    technique: granos de elote licuados con leche y crema, cocidos hasta espesar
    description_es: >
      Crema suave elaborada con granos de maíz dulce.
    description_en: >
      Smooth sweet corn cream soup — rich, velvety, and mildly sweet.
  de_espinaca:
    name_es: Crema de espinacas
    name_en: Spinach Cream Soup
    extra_ingredients:
      - espinacas
      - queso
    technique: espinacas cocidas licuadas con crema, leche y especias
    description_es: >
      Sopa cremosa de espinacas con leche y crema.
    description_en: >
      Creamy spinach soup blended with milk and cream — mild and comforting.
  de_verduras:
    name_es: Crema de verduras
    name_en: Vegetable Cream Soup
    extra_ingredients:
      - zanahoria
      - papa
      - calabaza
      - pollo
    technique: verduras cocidas licuadas con leche o crema y especias
    description_es: >
      Verduras mixtas licuadas con leche o crema; a veces con caldo de pollo.
    description_en: >
      Mixed vegetables cooked and blended with milk or cream — sometimes with chicken broth.
  de_champinones:
    name_es: Crema de champiñones
    name_en: Mushroom Cream Soup
    extra_ingredients:
      - champinon
      - mantequilla
      - cebolla
      - ajo
    technique: champiñones salteados con cebolla y ajo, licuados con crema y leche
    description_es: >
      Champiñones con cebolla, ajo, leche y crema.
    description_en: >
      Mushrooms sautéed with onion and garlic, finished with milk and cream.
  de_poblano:
    name_es: Crema de poblano
    name_en: Poblano Pepper Cream Soup
    extra_ingredients:
      - chile_poblano
    technique: chiles poblanos asados licuados con crema y leche
    description_es: >
      Crema preparada con chiles poblanos asados.
    description_en: >
      Cream soup made with roasted poblano peppers — earthy and mildly spicy.
