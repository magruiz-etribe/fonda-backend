canonical_name: chapulines
common_names:
  - chapulines
category: botana
base_ingredients:
  - chapulines
  - limon
  - ajo
  - sal
variants:
  chapulines:
    name_es: Chapulines
    name_en: Grasshoppers
    extra_ingredients:
      - chile_seco
    technique: tostado o frito, sazonado con ajo, limón y chile
    description_es: >
