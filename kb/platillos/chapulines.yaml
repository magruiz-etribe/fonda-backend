canonical_name: chapulines
common_names:
  - chapulines
category: botana
base_ingredients:
  - chapulines
  - limon
  - ajo
  - sal
variants:
  chapulines:
    name_es: Chapulines
    name_en: Toasted Grasshoppers
    extra_ingredients:
      - chile_seco
    technique: tostado o frito, sazonado con ajo, limón y chile
    description_es: >
      Chapulines tostados o fritos sazonados con ajo, limón, chile y sal;
      sabor salado y ligeramente ahumado. Se sirven como botana, en tacos,
      quesadillas o como acompañamiento.
    description_en: >
      Toasted or fried grasshoppers seasoned with garlic, lime, chile, and salt —
      crunchy, savory, and slightly smoky. Served as a snack or in tacos and
      quesadillas.
