canonical_name: empanada_frita
common_names:
category: antojito
base_ingredients:
  - masa
  - relleno
variants:
  empanada:
    name_es: Empanada
    name_en: Fried Turnover
    extra_ingredients:
      - queso
      - carne
      - pollo
    technique: 
    description_es: >
      Masa doblada rellena de queso, carne o pollo, sellada y frita hasta dorarse.
    description_en: >
      Masa folded stuffed of cheese, beef or chicken, sellada and frita hasta dorarse.
  empanadas_de_camaron:
    name_es: Empanadas de camarón
    name_en: Shrimp Empanadas
    extra_ingredients:
      - camaron
      - masa_de_maiz
      - cebolla
    technique: 
    description_es: >
      Masa rellena de camarón sazonado y frita.
    description_en: >
      Masa stuffed of camarón sazonado and frita.
  empanadas_de_cazon:
    name_es: Empanadas de cazón
    name_en: Dogfish Empanadas
    extra_ingredients:
      - cazon
      - masa_de_maiz
      - jitomate
    technique: 
    description_es: >
      Empanadas rellenas con cazón guisado.
    description_en: >
      Dogfish Empanadas made with cazon, corn masa and tomato.
  de_cajeta:
    name_es: Empanada de cajeta
    name_en: Cajeta Empanada
    extra_ingredients:
      - harina
      - cajeta
      - mantequilla
    technique: 
    description_es: >
      Empanada dulce rellena con cajeta.
    description_en: >
      Empanada dulce stuffed with cajeta.
  de_pina:
    name_es: Empanada de piña
    name_en: Pineapple Empanada
    extra_ingredients:
      - harina
      - pina
      - azucar
    technique: 
    description_es: >
      Empanada dulce rellena con mermelada de piña.
    description_en: >
      Empanada dulce stuffed with mermelada of piña.
  de_camote:
    name_es: Empanada de camote
    name_en: Sweet Potato Empanada
    extra_ingredients:
      - harina
      - camote
      - azucar
    technique: 
    description_es: >
      Empanada rellena con dulce de camote.
    description_en: >
      Empanada stuffed with dulce of camote.
