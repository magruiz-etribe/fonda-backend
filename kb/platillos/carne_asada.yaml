canonical_name: carne_asada
common_names:
  - carne asada
  - tacos de carne asada
  - torta de carne asada
  - burritos de carne asada
  - gringas de carne asada
  - arrachera
category: platillo_principal
base_ingredients:
  - carne_de_res
  - sal
  - pimienta
  - limon
variants:
  con_guarniciones:
    name_es: Carne Asada con Guarniciones
    name_en: Grilled beef platter with sides
    extra_ingredients:
      - cebollitas_cambray
      - nopales
      - guacamole
      - salsa
    technique: cocción a la parrilla o plancha con sazón sencillo
    description_es: >
      Carne de res cocinada a la plancha o parrilla con sazón simple, con acompañamientos tradicionales
    description_en: >
      Grilled beef served with green onions, cactus strips, guacamole, and salsa — the classic Mexican grilled platter.
  tacos:
    name_es: Tacos de Carne Asada
    name_en: Grilled beef tacos
    extra_ingredients:
      - tortilla_de_maiz
      - cebolla
      - cilantro
      - salsa
      - guacamole
    technique: carne a la plancha, servida en tortilla de maíz
    description_es: >
      Carne asada de res servida en tortillas suaves
    description_en: >
      Grilled beef in warm corn tortillas with onion, cilantro, and salsa — simple and incredibly popular.
  torta:
    name_es: Torta de Carne Asada
    name_en: Grilled beef sandwich (Mexican-style torta)
    extra_ingredients:
      - bolillo
      - aguacate
      - frijoles
      - queso
      - jitomate
      - jalapeno
    technique: carne a la plancha, armado en bolillo tostado con complementos
    description_es: >
      Carne asada servida en pan crujiente, con múltiples complementos
    description_en: >
      Grilled beef on a crusty bolillo roll with avocado, beans, cheese, tomato, and jalapeño — a hearty Mexican sandwich.
  burritos:
    name_es: Burritos de Carne Asada
    name_en: Grilled beef burritos
    extra_ingredients:
      - tortilla_de_harina
      - arroz
      - queso
      - crema
      - salsa
      - frijoles
    technique: carne a la plancha, envuelta en tortilla de harina grande
    description_es: >
      Carne asada envuelta en tortilla grande de harina
    description_en: >
      Grilled beef with rice, beans, and cheese wrapped in a large flour tortilla.
  gringas:
    name_es: Gringas de Carne Asada
    name_en: Flour tortilla quesadilla with grilled beef
    extra_ingredients:
      - tortilla_de_harina
      - queso
      - salsa
      - cebolla
      - cilantro
    technique: quesadilla de tortilla de harina con queso fundido y carne
    description_es: >
      Quesadilla grande con carne asada y queso derretido
    description_en: >
      Flour tortilla quesadilla filled with grilled beef and melted cheese — crispy and richly flavored.
