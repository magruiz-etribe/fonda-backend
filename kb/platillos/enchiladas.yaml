canonical_name: enchiladas
common_names:
  - enchiladas
  - enchiladas rojas
  - enchiladas verdes
  - enchiladas suizas
  - enchiladas potosinas
  - enchiladas mineras
  - enchiladas placeras
  - enchiladas de mole
  - enchiladas queretanas
  - enfrijoladas
  - entomatadas
category: antojito
base_ingredients:
  - tortilla_de_maiz
  - salsa
  - aceite
  - sal
variants:
  rojas:
    name_es: Enchiladas Rojas
    name_en: Red enchiladas
    extra_ingredients:
      - chile_guajillo
      - chile_ancho
      - queso_fresco
      - crema
      - cebolla
      - lechuga
    technique: tortilla frita ligeramente, bañada en salsa roja de chile seco
    description_es: >
      tortillas de maíz suavizadas en aceite y bañadas en una salsa de chile rojo seco (generalmente guajillo, ancho o pasilla).
    description_en: >
      Corn tortillas softened in oil and dipped in a red dried-chile sauce — served with fresh cheese, sour cream, and onion.
  verdes:
    name_es: Enchiladas Verdes
    name_en: Green enchiladas
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - queso_fresco
      - crema
      - cebolla
      - cilantro
    technique: tortilla frita ligeramente, bañada en salsa verde de tomatillo
    description_es: >
      tortillas de maíz bañadas en una salsa verde hecha principalmente de tomatillo (tomate verde), chile, ajo y cebolla.
    description_en: >
      Tortillas bathed in tomatillo and serrano chile green sauce — fresh and mildly spicy.
  suizas:
    name_es: Enchiladas Suizas
    name_en: Swiss-style enchiladas
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - crema
      - queso_gratinado
      - cilantro
      - pollo
    technique: salsa verde con crema, rellenas de pollo, gratinadas al horno
    description_es: >
      Tortillas en salsa verde de tomatillo con crema, rellenas de pollo, gratinadas con queso.
    description_en: >
      Corn tortillas filled with chicken, bathed in a creamy tomatillo sauce and oven-gratinéed with melted cheese until golden — the Swiss-style variation.
  potosinas:
    name_es: Enchiladas Potosinas
    name_en: Potosí-style enchiladas
    extra_ingredients:
      - chile_ancho
      - queso_fresco
      - crema
      - lechuga
    technique: masa coloreada con chile, doblada o formada en empanada pequeña
    description_es: >
      tortilla sazonada con chile desde la masa, se rellena comúnmente con queso fresco, y luego se dobla o forma pequeñas empanadas antes de cocinarse ligeramente en el comal o freírse.
    description_en: >
      Chile-tinted masa stuffed with fresh cheese, shaped into small patties and cooked on a comal — a unique San Luis Potosí style.
  mineras:
    name_es: Enchiladas Mineras
    name_en: Miner’s enchiladas
    extra_ingredients:
      - chile_guajillo
      - queso_fresco
      - crema
      - papa
      - zanahoria
      - lechuga
    technique: tortilla frita y bañada en salsa guajillo, con papa y zanahoria cocidas
    description_es: >
      tortillas de maíz ligeramente fritas, bañadas en una salsa roja de chile guajillo. Generalmente se rellenan de queso o pollo deshebrado, y se sirven acompañadas de papas y zanahorias
    description_en: >
      Fried tortillas in guajillo red sauce, served with cooked potato and carrot — the Guanajuato mining-town style.
  de_mole:
    name_es: Enchiladas de Mole
    name_en: Mole enchiladas
    extra_ingredients:
      - mole
      - queso_fresco
      - crema
      - cebolla
      - ajonjoli
    technique: tortilla bañada en mole espeso
    description_es: >
      Tortillas bañadas en mole de chiles secos, especias, nueces o semillas y, en algunos casos, chocolate.
    description_en: >
      Tortillas bathed in a thick, complex mole sauce — deeply flavored with the rich character of black, red, or poblano mole.
  queretanas:
    name_es: Enchiladas Queretanas
    name_en: Querétaro-style enchiladas
    extra_ingredients:
      - chile_guajillo
      - chile_ancho
      - queso_fresco
      - crema
      - papa
      - zanahoria
    technique: tortilla frita y bañada en salsa guajillo, rellena de papa y zanahoria
    description_es: >
      tortillas de maíz ligeramente fritas y bañadas en una salsa roja de chile guajillo o chile ancho. Suelen rellenarse de papa y zanahoria cocida
    description_en: >
      Fried tortillas in guajillo sauce, stuffed with cooked potato and carrot, finished with fresh cheese — Querétaro style.
  enfrijoladas:
    name_es: Enfrijoladas
    name_en: Enfrijoladas
    extra_ingredients:
      - frijoles_negros
      - queso_fresco
      - crema
      - cebolla
      - cilantro
    technique: tortilla pasada por salsa espesa de frijol molido
    description_es: >
      tortillas de maíz bañadas en una salsa de frijol molido, que suele prepararse con frijoles negros o bayos cocidos, ajo, cebolla y, en ocasiones, chile. Se rellenan comúnmente de pollo deshebrado, queso, jamón o huevo
    description_en: >
      Tortillas dipped in a thick black or pinto bean sauce — filled with cheese, chicken, or egg, and topped with sour cream and fresh cheese.
  entomatadas:
    name_es: Entomatadas
    name_en: Entomatadas
    extra_ingredients:
      - jitomate
      - chile
      - queso_fresco
      - crema
      - cebolla
    technique: tortilla bañada en salsa de jitomate cocido y licuado
    description_es: >
      tortillas de maíz bañadas en una salsa de jitomate (tomate rojo) cocido y licuado. Se rellenan comúnmente de pollo deshebrado, queso o huevo
    description_en: >
      Tortillas dipped in a cooked red tomato sauce with garlic and onion — fresh flavored and simple.
  placeras:
    name_es: Enchiladas Placeras
    name_en: Market-style enchiladas
    extra_ingredients:
      - chile_guajillo
      - queso_rallado
      - crema
      - lechuga
      - papa
      - zanahoria
    technique: tortilla frita y bañada en salsa guajillo con papa y zanahoria
    description_es: >
      tortillas de maíz fritas ligeramente, bañadas en salsa roja de chile guajillo, y suelen rellenarse de queso fresco o pollo deshebrado. Se acompañan con papas y zanahorias cocidas,
    description_en: >
      Lightly fried corn tortillas in guajillo red sauce, usually stuffed with fresh cheese or shredded chicken, served with cooked potatoes and carrots.
