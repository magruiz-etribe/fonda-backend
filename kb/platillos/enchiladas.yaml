    description_es: >
      Enchiladas rojas dobladas con chile en masa.
    description_en: >
      Red folded enchiladas with chile-infused masa, filled with fresh cheese and cream, served with lettuce and corn masa.
  mineras:
    name_es: Enchiladas mineras
    name_en: Miner’s enchiladas
