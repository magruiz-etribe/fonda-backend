canonical_name: enchiladas
common_names:
  - enchiladas
  - enchiladas rojas
  - enchiladas verdes
  - enchiladas suizas
  - enchiladas potosinas
  - enchiladas mineras
  - enchiladas placeras
  - enchiladas de mole
  - enchiladas queretanas
  - entomatadas
category: antojito
base_ingredients:
  - tortilla_de_maiz
  - salsa
  - aceite
  - sal
variants:
  rojas:
    name_es: Enchiladas rojas
    name_en: Red Enchiladas
    extra_ingredients:
      - chile_guajillo
      - chile_ancho
      - queso_fresco
      - crema
      - cebolla
      - lechuga
      - pollo
      - queso
    technique: tortilla frita ligeramente, bañada en salsa roja de chile seco
    description_es: >
      Tortillas bañadas en salsa roja; rellenas de pollo o queso.
    description_en: >
      Tortillas dipped in red dried-chile sauce — filled with chicken or cheese, topped with cream and onion.
  verdes:
    name_es: Enchiladas verdes
    name_en: Green Enchiladas
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - queso_fresco
      - crema
      - cebolla
      - cilantro
      - pollo
      - queso
    technique: tortilla frita ligeramente, bañada en salsa verde de tomatillo
    description_es: >
      Tortillas bañadas en salsa verde; rellenas de pollo o queso.
    description_en: >
      Tortillas in tangy green tomatillo sauce — filled with chicken or cheese, finished with cream and cilantro.
  suizas:
    name_es: Enchiladas suizas
    name_en: Swiss-style Enchiladas
    extra_ingredients:
      - tomatillo
      - chile_serrano
      - crema
      - queso_gratinado
      - cilantro
      - pollo
    technique: salsa verde con crema, rellenas de pollo, gratinadas al horno
    description_es: >
      Enchiladas en salsa verde cremosa con queso gratinado.
    description_en: >
      Chicken enchiladas in creamy green sauce, baked with melted cheese on top.
  potosinas:
    name_es: Enchiladas potosinas
    name_en: San Luis Potosí Enchiladas
    extra_ingredients:
      - chile_ancho
      - chile_guajillo
      - queso_fresco
      - crema
      - lechuga
      - masa_de_maiz
    technique: masa coloreada con chile, doblada con queso y frita
    description_es: >
      Enchiladas de masa teñida con chile, rellenas de queso.
    description_en: >
      Chile-infused corn masa folded around fresh cheese and fried — a San Luis Potosí specialty.
  mineras:
    name_es: Enchiladas mineras
    name_en: Miner's Enchiladas
    extra_ingredients:
      - chile_guajillo
      - queso_fresco
      - crema
      - papa
      - zanahoria
      - lechuga
    technique: tortilla frita y bañada en salsa guajillo, con papa y zanahoria cocidas
    description_es: >
      Enchiladas guanajuatenses con papa y zanahoria.
    description_en: >
      Guanajuato-style enchiladas in guajillo sauce with boiled potato and carrot.
  de_mole:
    name_es: Enchiladas de mole
    name_en: Mole Enchiladas
    extra_ingredients:
      - mole
      - queso_fresco
      - crema
      - cebolla
      - ajonjoli
      - pollo
    technique: tortilla bañada en mole espeso
    description_es: >
      Tortillas bañadas en mole espeso con pollo y queso.
    description_en: >
      Tortillas bathed in thick mole sauce — rich and complex.
  queretanas:
    name_es: Enchiladas queretanas
    name_en: Querétaro-style Enchiladas
    extra_ingredients:
      - chile_guajillo
      - chile_ancho
      - queso_fresco
      - crema
      - papa
      - zanahoria
      - lechuga
    technique: tortilla frita y bañada en salsa guajillo, rellena de papa y zanahoria
    description_es: >
      Enchiladas con papa, zanahoria y lechuga.
    description_en: >
      Querétaro-style enchiladas served with potato, carrot, and lettuce.
  entomatadas:
    name_es: Entomatadas
    name_en: Tomato-sauce Enchiladas
    extra_ingredients:
      - jitomate
      - chile
      - queso_fresco
      - crema
      - cebolla
    technique: tortilla bañada en salsa de jitomate cocido y licuado
    description_es: >
      Tortillas bañadas en salsa de jitomate y rellenas al gusto.
    description_en: >
      Tortillas in cooked blended tomato sauce — milder than chile-based enchiladas.
  placeras:
    name_es: Enchiladas placeras
    name_en: Market-style Enchiladas
    extra_ingredients:
      - chile_guajillo
      - queso_rallado
      - crema
      - lechuga
      - papa
      - zanahoria
    technique: tortilla frita y bañada en salsa guajillo con papa, zanahoria y verduras encurtidas
    description_es: >
      Enchiladas acompañadas con verduras encurtidas.
    description_en: >
      Market-style enchiladas in guajillo sauce with potato, carrot, and pickled vegetables.
