canonical_name: sopas
common_names:
  - sopa de fideo
  - sopa de lentejas
  - sopa de tortilla
category: caldo
base_ingredients:
  - carne_de_res_deshebrada
  - jitomate
  - cebolla
  - ajo
  - caldo_de_pollo
  - sal
variants:
  de_fideo:
    name_es: Sopa De Fideo
    name_en: Mexican Noodle Soup
    extra_ingredients:
      - fideo
      - aguacate
      - queso
      - crema
      - limon
      - chile
      - pollo_deshebrado_o_jamon_picado
    technique: 
    description_es: >
      Pasta delgada en caldo de jitomate caliente.
    description_en: >
      Pasta delgada en caldo de jitomate caliente.
  de_lentejas:
    name_es: Sopa De Lentejas
    name_en: Lentil Soup
    extra_ingredients:
      - lentejas
      - tocino
      - platano_macho
      - zanahoria
      - chorizo
      - cilantro
      - limon
    technique: 
    description_es: >
      lentejas cocidas en caldo con jitomate, cebolla, ajo y especias, puede incluir verduras como zanahoria, papa o apio, y en algunas versiones se añade tocino, plátano o chorizo.
    description_en: >
      lentejas cocidas en caldo con jitomate, cebolla, ajo y especias, puede incluir verduras como zanahoria, papa o apio, y en algunas versiones se añade tocino, plátano o chorizo.
  de_tortilla:
    name_es: Sopa De Tortilla
    name_en: Tortilla Soup
    extra_ingredients:
      - tortilla_de_maiz
      - chile_pasilla
      - aguacate
      - crema
      - queso_panela
      - chicharron
      - pollo
      - limon
    technique: 
    description_es: >
      Caldo de jitomate con tiras de tortilla frita, queso, crema y aguacate.
    description_en: >
      Caldo de jitomate con tiras de tortilla frita, queso, crema y aguacate.
