canonical_name: sopas
common_names:
  - sopa de fideo
  - sopa de lentejas
  - sopa de tortilla
  - sopa de lima
  - sopa de letras
  - sopa de guías
  - sopa de pan
  - sopa de verduras
  - sopa de habas
  - sopa de ajo
  - sopa de mariscos
category: caldo
base_ingredients:
  - caldo_de_pollo
  - jitomate
  - cebolla
  - ajo
  - sal
variants:
  de_fideo:
    name_es: Sopa de fideo
    name_en: Mexican Noodle Soup
    extra_ingredients:
      - fideo
      - pasta
    technique: pasta dorada en aceite, cocida en caldo de jitomate
    description_es: >
      Pasta de fideo, coditos o letras dorada en caldo de jitomate.
    description_en: >
      Thin noodles, elbow pasta, or alphabet pasta toasted in oil and cooked in tomato broth.
  de_lentejas:
    name_es: Sopa de lentejas
    name_en: Lentil Soup
    extra_ingredients:
      - lentejas
      - zanahoria
      - jitomate
    technique: lentejas cocidas con verduras en caldo sazonado
    description_es: >
      Sopa casera de lentejas con verduras.
    description_en: >
      Homestyle lentil soup with carrots and tomato — hearty and nourishing.
  de_tortilla:
    name_es: Sopa de tortilla
    name_en: Tortilla Soup
    extra_ingredients:
      - tortilla
      - chile_pasilla
      - aguacate
      - crema
      - queso_fresco
    technique: caldo de jitomate con tiras de tortilla frita y chile pasilla
    description_es: >
      Caldo de jitomate con tiras de tortilla frita.
    description_en: >
      Tomato broth with crispy fried tortilla strips, pasilla chile, avocado, and cream.
  de_lima:
    name_es: Sopa de lima
    name_en: Lime Soup
    extra_ingredients:
      - pollo
      - lima
      - tortilla_frita
      - cebolla
    technique: caldo de pollo con lima yucateca, servido con tortilla frita
    description_es: >
      Sopa yucateca de pollo con jugo de lima agria.
    description_en: >
      Yucatecan chicken soup brightened with sour lime juice and crispy tortilla strips.
  de_guias:
    name_es: Sopa de guías
    name_en: Squash Vine Soup
    extra_ingredients:
      - guias_de_calabaza
      - elote
      - flor_de_calabaza
    technique: guías de calabaza cocidas con elote y flor de calabaza en caldo
    description_es: >
      Sopa oaxaqueña con guías de calabaza, elote y flor de calabaza.
    description_en: >
      Oaxacan soup of squash vines with corn and squash blossoms — delicate and seasonal.
  de_pan:
    name_es: Sopa de pan
    name_en: Bread Soup
    extra_ingredients:
      - pan
      - caldo_de_pollo
      - jitomate
    technique: pan remojado en caldo de pollo con jitomate y especias
    description_es: >
      Sopa tradicional con pan remojado en caldo.
    description_en: >
      Traditional soup of bread soaked in seasoned chicken broth with tomato.
  de_verduras:
    name_es: Sopa de verduras
    name_en: Vegetable Soup
    extra_ingredients:
      - zanahoria
      - papa
      - calabaza
      - chayote
    technique: verduras mixtas cocidas en caldo ligero
    description_es: >
      Sopa casera con verduras mixtas.
    description_en: >
      Homestyle soup of mixed vegetables in light broth.
  de_habas:
    name_es: Sopa de habas
    name_en: Fava Bean Soup
    extra_ingredients:
      - haba
      - ajo
      - jitomate
    technique: habas cocidas y licuadas parcialmente en caldo con ajo y jitomate
    description_es: >
      Sopa espesa de habas típica de fonda.
    description_en: >
      Thick fava bean soup with garlic and tomato — earthy and filling.
  de_ajo:
    name_es: Sopa de ajo
    name_en: Garlic Soup
    extra_ingredients:
      - ajo
      - pan
      - caldo
    technique: ajo dorado en caldo con pan tostado
    description_es: >
      Sopa ligera con ajo y pan.
    description_en: >
      Light garlic broth with toasted bread — simple and aromatic.
  de_mariscos:
    name_es: Sopa de mariscos
    name_en: Mixed Seafood Soup
    extra_ingredients:
      - camaron
      - pescado
      - almeja
      - jitomate
    technique: mariscos cocidos en caldo de jitomate con verduras
    description_es: >
      Caldo con camarón, pescado y almejas en salsa de jitomate.
    description_en: >
      Tomato-based broth with shrimp, fish, and clams — typical of coastal fondas.
